\* Thread-model C5 -- a doomed thread's die-check does not read the exec claim
\* as death (BUGGY_DOOM_MISSED: thread_die_pending and the waits it ends lack
\* the exec leg), so a peer that never exits of its own accord is never killed
\* and the execer waits for it forever.
\* Expected: ExecResolves VIOLATED (temporal).
CONSTANTS
    Threads = {t1, t2, t3}
    Main = t1
    Cap = 3
    NoThread = NoThread
    BUGGY_ADMIT_SPLIT = FALSE
    BUGGY_COUNT_SPLIT = FALSE
    BUGGY_SPAWNER_FREE = FALSE
    BUGGY_ZOMBIE_BEFORE_COMMIT = FALSE
    BUGGY_FREE_ON_CPU = FALSE
    BUGGY_TWO_REAPERS = FALSE
    BUGGY_EXEC_EARLY = FALSE
    BUGGY_WAITPID_UNLOCKED = FALSE
    BUGGY_REAP_AT_SPAWN = FALSE
    BUGGY_CAP_COUNTS_EXITED = FALSE
    BUGGY_EXEC_PERTHREAD = FALSE
    BUGGY_DOOM_MISSED = TRUE
SPECIFICATION Spec
PROPERTY ExecResolves
