\* debug_stop_buggy_spawner_latch_returns.cfg -- the held spawn's birth wait
\* returns on an interrupt latched on the spawner, as await_child_release did
\* before DEBUG-FS-DESIGN 5g: its plain sleep reported the latch as SLEEP_INTR
\* and the wait broke on it. The latch is revocable, so the spawner can live on
\* and return from the spawn while its child is still loading.
\* Expected: SpawnReturnsAfterBirth VIOLATED.
CONSTANTS
    Threads = {t1}
    BUGGY_STOP_BEFORE_DIE = FALSE
    BUGGY_OBSERVE_BEFORE_REGISTER = FALSE
    BUGGY_DOUBLE_WAKE = FALSE
    BUGGY_STRAND_ON_CLOSE = FALSE
    BUGGY_FAULT_STOP_UNGATED = FALSE
    BUGGY_STOP_SKIPS_SLEEPER = FALSE
    BUGGY_EXITKILL_IGNORED = FALSE
    HELD = TRUE
    BUGGY_HELD_RUNS_FREE = FALSE
    BUGGY_CONVERT_CLEARS_FIRST = FALSE
    BUGGY_ORPHAN_HOLD_STRANDS = FALSE
    BUGGY_BIRTH_WAIT_UNWOKEN = FALSE
    BUGGY_NO_DEATH_RECHECK = FALSE
    BUGGY_BIRTH_LATCH_ERETS = FALSE
    BUGGY_TAIL_LATCH_ERETS = FALSE
    BUGGY_LATCH_ENDS_STOP = FALSE
    BUGGY_SPAWNER_LATCH_RETURNS = TRUE
SPECIFICATION Spec
INVARIANT SpawnReturnsAfterBirth
