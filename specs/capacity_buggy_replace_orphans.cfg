\* B-1a audit F5 -- the D-3b MAP_FIXED window inside a TOUCHED lazy mapping.
\* The surgery cut the old VMA around the window and uninstalled the window's
\* PTEs, but the old Burrow's slots under the window stayed resident and
\* charged: no mapping named them any more, so no detach or decommit could
\* ever refund them, and the Burrow's last free returned the pages to the
\* system with the charge still on the address space (an over-charge, the
\* safe direction -- and a leak of the budget for the Proc's life).
\* Expected: NoOrphan VIOLATED at the first Replace of a touched slot.
CONSTANTS
    Slots = {s1, s2, s3, s4}
    BUGGY_REPLACE_KEEPS_ORPHANS = TRUE
    BUGGY_DETACH_NO_REFUND = FALSE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT ChargeConserved
INVARIANT NoOrphan
