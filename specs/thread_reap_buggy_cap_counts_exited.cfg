\* Thread-model C1 -- the cap counts every linked thread (BUGGY_CAP_COUNTS_EXITED):
\* a thread that has committed EXITING, and whose joiner may already have been
\* woken, stays charged until its reaper unlinks it, so a Proc at the cap that
\* joined a thread is refused the next create (corona, yip 0245; vote 7, 10-22).
\* The trace: t1 admits t2 (linked 2 = Cap), t2 commits EXITING (live 1), and
\* t1, RUNNING with t3 unborn and room by the live count, finds the guard shut.
\* Expected: ExitedNotCharged VIOLATED.
CONSTANTS
    Threads = {t1, t2, t3}
    Main = t1
    Cap = 2
    BUGGY_ADMIT_SPLIT = FALSE
    BUGGY_COUNT_SPLIT = FALSE
    BUGGY_SPAWNER_FREE = FALSE
    BUGGY_ZOMBIE_BEFORE_COMMIT = FALSE
    BUGGY_FREE_ON_CPU = FALSE
    BUGGY_TWO_REAPERS = FALSE
    BUGGY_EXEC_EARLY = FALSE
    BUGGY_WAITPID_UNLOCKED = FALSE
    BUGGY_REAP_AT_SPAWN = FALSE
    BUGGY_CAP_COUNTS_EXITED = TRUE
SPECIFICATION Spec
INVARIANT ExitedNotCharged
