\* Votes M31, M33 and M34 (audit rounds 8 and 9 of M15): Stratum gives a
\* deleted file's number to the next file created. Every open is named by
\* number and generation where its fid is made; a refused run is recorded under
\* its holder's own name; a deleted file's open reads through the Larder, which
\* serves it only entries under its name. Staging on, every buggy flag off.
\* From fs_cache_wb.cfg: EnableReuse TRUE and MaxGen 0 -> 2 (two constants),
\* and the invariants InvariantsReuse adds (NamesTrue, RecordsTrue,
\* DeadStateSkipped, NoMisdirectedLoss, CacheOfLiveFile). Expected: every
\* invariant listed holds.
SPECIFICATION Spec

CONSTANTS
    Files                   = {f1, f2}
    Capacity                = 1
    MaxCvers                = 3
    EnableExternalWriter    = FALSE
    BUGGY_STALE_SERVE       = FALSE
    BUGGY_NO_OWN_INVALIDATE = FALSE
    EnableStaging           = TRUE
    BUGGY_READ_SKIPS_STAGED = FALSE
    BUGGY_LOST_STAGE        = FALSE
    EnableFlushPopulate     = TRUE
    BUGGY_POPULATE_UNFLUSHED = FALSE
    Opens                   = {o1, o2}
    BUGGY_PEER_SKIPS_STAGED = FALSE
    BUGGY_PEER_WRITE_UNORDERED = FALSE
    BUGGY_SKIP_KEEPS_ENTRY = FALSE
    BUGGY_NO_PIN = FALSE
    EnableReuse = TRUE
    MaxGen = 2
    BUGGY_NUMBER_KEY = FALSE
    BUGGY_UNNAMED_WALK = FALSE
    BUGGY_NUMBER_SERVE = FALSE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    TypeOk
    CacheNeverAhead
    ServerNeverAhead
    Bounded
    NoStalePastRevalidation
    NoWrongRead
    NoLostStage
    OneHolder
    NamesTrue
    RecordsTrue
    DeadStateSkipped
    NoMisdirectedLoss
    CacheOfLiveFile
