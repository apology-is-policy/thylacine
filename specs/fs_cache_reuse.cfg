\* Votes M31 and M33 (audit round 8 of M15, F3): Stratum gives a deleted file's
\* number to the next file created. Every open is named by number and
\* generation where its fid is made; a dead holder's run is recorded under its
\* own name. Staging on, every buggy flag off, one variable (EnableReuse) from
\* fs_cache_wb.cfg. Expected: every invariant of InvariantsReuse holds.
SPECIFICATION Spec

CONSTANTS
    Files                   = {f1, f2}
    Capacity                = 1
    MaxCvers                = 3
    EnableExternalWriter    = FALSE
    BUGGY_STALE_SERVE       = FALSE
    BUGGY_NO_OWN_INVALIDATE = FALSE
    EnableStaging           = TRUE
    BUGGY_READ_SKIPS_STAGED = FALSE
    BUGGY_LOST_STAGE        = FALSE
    EnableFlushPopulate     = TRUE
    BUGGY_POPULATE_UNFLUSHED = FALSE
    Opens                   = {o1, o2}
    BUGGY_PEER_SKIPS_STAGED = FALSE
    BUGGY_PEER_WRITE_UNORDERED = FALSE
    BUGGY_SKIP_KEEPS_ENTRY = FALSE
    BUGGY_NO_PIN = FALSE
    EnableReuse = TRUE
    MaxGen = 2
    BUGGY_NUMBER_KEY = FALSE
    BUGGY_UNNAMED_WALK = FALSE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    TypeOk
    CacheNeverAhead
    ServerNeverAhead
    Bounded
    NoStalePastRevalidation
    NoWrongRead
    NoLostStage
    OneHolder
    NamesTrue
    RecordsTrue
    DeadStateSkipped
    NoMisdirectedLoss
