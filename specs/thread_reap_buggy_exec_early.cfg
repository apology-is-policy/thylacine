\* Thread-model C1/C5 -- exec swaps the address space once it is the only LIVE
\* thread (BUGGY_EXEC_EARLY: its wait ends on live_threads == 1), while a peer
\* its claim killed has committed EXITING and still runs its exit tail on
\* another CPU (F-1).
\* Expected: NoSwapWhileOnCpu VIOLATED.
CONSTANTS
    Threads = {t1, t2, t3}
    Main = t1
    Cap = 3
    NoThread = NoThread
    BUGGY_ADMIT_SPLIT = FALSE
    BUGGY_COUNT_SPLIT = FALSE
    BUGGY_SPAWNER_FREE = FALSE
    BUGGY_ZOMBIE_BEFORE_COMMIT = FALSE
    BUGGY_FREE_ON_CPU = FALSE
    BUGGY_TWO_REAPERS = FALSE
    BUGGY_EXEC_EARLY = TRUE
    BUGGY_WAITPID_UNLOCKED = FALSE
    BUGGY_REAP_AT_SPAWN = FALSE
    BUGGY_CAP_COUNTS_EXITED = FALSE
    BUGGY_EXEC_PERTHREAD = FALSE
    BUGGY_DOOM_MISSED = FALSE
SPECIFICATION Spec
INVARIANT NoSwapWhileOnCpu
