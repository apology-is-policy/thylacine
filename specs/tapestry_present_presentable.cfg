\* Warp WSI W-3b -- the PRESENTABLE model, clean (WARP-WSI-DESIGN sections
\* 4 + 6). A venus swapchain image is a first-class presentable: a shareable
\* NON-mappable HOST3D blob with a display shape declared at registration,
\* scanned out directly (SET_SCANOUT_BLOB, the Direct arm) or composed from
\* (the C-3 blit / C-6 readback source -- one read class). ALLOW_PRESENTABLE
\* on top of EVERY other ALLOW_*, so the fourth in-flight class interleaves
\* with all three weave classes, the reweave, and the crash.
\*
\* TLC proves the presentable path upholds every pre-W-3b invariant unchanged
\* plus the three additions: NoTornPresentable (the display never observes a
\* retired presentable -- neither through the standing scanout binding nor
\* through the transient compose read), PGoneClean (the blob unrefs only
\* after all four holder classes release -- I-7/I-37 extended by one class),
\* and PObserverScoped (no observer outside the registration's lifetime).
\* Expected: TLC-green.
