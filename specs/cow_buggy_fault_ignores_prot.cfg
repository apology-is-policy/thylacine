\* BUG 5 -- the break entered before the prot check. The write-fault arm
\* resolves the Burrow and starts the COW break without first enforcing the
\* VMA's prot, so a write to an ro/none mapping allocates and copies for an
\* access that had to be refused. The correct arm checks prot at the fault
\* boundary (fault.c step 2) before step 3 ever looks at the Burrow.
\* (The same bug goes on to install a writable PTE under an ro prot, so
\* NoWritablePteBeyondProt would fire two steps later; this cfg names the
\* earlier, causal invariant.)
\* Expected: BreakOnlyWhenWritable VIOLATED.
CONSTANTS
    Sharers = {s1, s2}
    BUGGY_BREAK_UNLOCKED = FALSE
    BUGGY_TEARDOWN_NO_PIN = FALSE
    BUGGY_VFORK_OBSERVE_BEFORE_PARK = FALSE
    ALLOW_PROTECT = TRUE
    Pieces = 1
    BUGGY_PROTECT_KEEPS_PTE = FALSE
    BUGGY_FAULT_IGNORES_PROT = TRUE
    BUGGY_CLONE_PER_PIECE = FALSE
SPECIFICATION SpecProtect
INVARIANT TypeOk
INVARIANT BreakOnlyWhenWritable
