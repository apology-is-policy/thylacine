\* BUG 1 -- break-vs-break. The drop/decide/act sequence is NOT atomic, so two
\* sharers can each drop their share and then BOTH read zero, and both conclude
\* "I am the last sharer" -> both take the SAME pristine page in place, both
\* writable. That is one address space's writes landing in another's.
\* Expected: NoAliasedWritable VIOLATED.
CONSTANTS
    Sharers = {s1, s2}
    BUGGY_BREAK_UNLOCKED = TRUE
    BUGGY_TEARDOWN_NO_PIN = FALSE
    BUGGY_VFORK_OBSERVE_BEFORE_PARK = FALSE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT NoAliasedWritable
