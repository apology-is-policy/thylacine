\* debug_stop_buggy_birth_latch_erets.cfg -- the birth park's latch leg erets,
\* as the ordinary stop park's leg does: an interrupt latched on a held child
\* sends the park back to the tail, which erets, and the child runs its first
\* instructions with its hold still standing. The birth park must end the
\* child on the latch instead (DEBUG-FS-DESIGN 5f point 10).
\* Expected: NoEL0WhileHeld VIOLATED.
CONSTANTS
    Threads = {t1}
    BUGGY_STOP_BEFORE_DIE = FALSE
    BUGGY_OBSERVE_BEFORE_REGISTER = FALSE
    BUGGY_DOUBLE_WAKE = FALSE
    BUGGY_STRAND_ON_CLOSE = FALSE
    BUGGY_FAULT_STOP_UNGATED = FALSE
    BUGGY_STOP_SKIPS_SLEEPER = FALSE
    BUGGY_EXITKILL_IGNORED = FALSE
    HELD = TRUE
    BUGGY_HELD_RUNS_FREE = FALSE
    BUGGY_CONVERT_CLEARS_FIRST = FALSE
    BUGGY_ORPHAN_HOLD_STRANDS = FALSE
    BUGGY_BIRTH_WAIT_UNWOKEN = FALSE
    BUGGY_NO_DEATH_RECHECK = FALSE
    BUGGY_BIRTH_LATCH_ERETS = TRUE
    BUGGY_BIRTH_LATCH_RERUN = FALSE
SPECIFICATION Spec
INVARIANT NoEL0WhileHeld
