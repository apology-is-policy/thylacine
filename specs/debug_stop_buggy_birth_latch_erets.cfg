\* debug_stop_buggy_birth_latch_erets.cfg -- the birth park leaves on a latched
\* interrupt and erets, as the tail's stop park did before DEBUG-FS-DESIGN 5g:
\* an interrupt latched on a held child sends the park back to the tail, which
\* erets, and the child runs its first instructions with its hold still
\* standing (audit round 1 of the birth hold, F1). The park keeps the child
\* parked instead (5g).
\* Expected: NoEL0WhileHeld VIOLATED.
CONSTANTS
    Threads = {t1}
    BUGGY_STOP_BEFORE_DIE = FALSE
    BUGGY_OBSERVE_BEFORE_REGISTER = FALSE
    BUGGY_DOUBLE_WAKE = FALSE
    BUGGY_STRAND_ON_CLOSE = FALSE
    BUGGY_FAULT_STOP_UNGATED = FALSE
    BUGGY_STOP_SKIPS_SLEEPER = FALSE
    BUGGY_EXITKILL_IGNORED = FALSE
    HELD = TRUE
    BUGGY_HELD_RUNS_FREE = FALSE
    BUGGY_CONVERT_CLEARS_FIRST = FALSE
    BUGGY_ORPHAN_HOLD_STRANDS = FALSE
    BUGGY_BIRTH_WAIT_UNWOKEN = FALSE
    BUGGY_NO_DEATH_RECHECK = FALSE
    BUGGY_BIRTH_LATCH_ERETS = TRUE
    BUGGY_TAIL_LATCH_ERETS = FALSE
    BUGGY_LATCH_ENDS_STOP = FALSE
    BUGGY_SPAWNER_LATCH_RETURNS = FALSE
SPECIFICATION Spec
INVARIANT NoEL0WhileHeld
