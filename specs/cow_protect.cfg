\* B-1a -- the permission ceiling over COW (ARCH 6.5; I-12 + I-44), the CORRECT
\* protocol with the protect actions ENABLED: a protect that lowers the prot
\* uninstalls the range in the same locked step, the fault arm enforces the
\* VMA's prot before it resolves the Burrow, and a fork holds one share per
\* address space however many VMA pieces a Burrow was split into.
\* Three sharers, as cow.cfg; SpecProtect adds fairness on the vfork
\* sub-machine because the protect ladder makes the state graph cyclic.
\* Expected: TLC-green on Safety + ProtectSafety and on EventuallyReleased.
CONSTANTS
    Sharers = {s1, s2, s3}
    BUGGY_BREAK_UNLOCKED = FALSE
    BUGGY_TEARDOWN_NO_PIN = FALSE
    BUGGY_VFORK_OBSERVE_BEFORE_PARK = FALSE
    ALLOW_PROTECT = TRUE
    Pieces = 1
    BUGGY_PROTECT_KEEPS_PTE = FALSE
    BUGGY_FAULT_IGNORES_PROT = FALSE
    BUGGY_CLONE_PER_PIECE = FALSE
    MODEL_LEAF = FALSE
    BUGGY_PUT_BEFORE_REPLACE = FALSE
SPECIFICATION SpecProtect
INVARIANT Safety
INVARIANT ProtectSafety
PROPERTY EventuallyReleased
