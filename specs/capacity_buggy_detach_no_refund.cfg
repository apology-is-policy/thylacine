\* The pre-B-1a piece detach: unmapping a slot without releasing its page.
\* Before B-1a the whole-Burrow resident count was refunded once per PIECE
\* (a double refund); the fix made the refund the piece's OWN range, and a
\* detach that refunds NOTHING for its range is the other way to get it
\* wrong -- the page outlives its mapping, charged, unreachable.
\* Expected: NoOrphan VIOLATED at the first Detach of a touched slot.
CONSTANTS
    Slots = {s1, s2, s3, s4}
    BUGGY_REPLACE_KEEPS_ORPHANS = FALSE
    BUGGY_DETACH_NO_REFUND = TRUE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT ChargeConserved
INVARIANT NoOrphan
