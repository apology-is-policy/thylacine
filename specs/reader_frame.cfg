\* ARCH 8.8.1.1 (#90; the seam-90 close, 2026-10-06) -- the rule as built. An
\* interrupted elected 9P reader (death, stop or caught note) unwinds at ANY
\* byte; the client keeps the partial frame (c->rx_got) and the next reader
\* resumes it. The server carries NO fairness: it may stop mid-frame for good.
\* NoDesync + ResumePoint hold, and EventuallyUnwinds holds without the server
\* -- a server that stops cannot hold the reader (the seam-90 hang is gone).
\* Expected: TLC-green.
CONSTANTS
    N = 3
    BUGGY_DISCARD = FALSE
    BUGGY_BLOCK_THROUGH = FALSE
SPECIFICATION Spec
INVARIANT Safety
PROPERTY EventuallyUnwinds
