\* Vote 118/119 hand-over without the residency: the faulter that takes
\* over a lapsed record pays only the page it mints, not the pages its
\* dead predecessor paid for, which are still resident. It is then the
\* payer of a record it has not paid.
\* Expected: ChargeExact VIOLATED at the first hand-over over a resident page.
CONSTANTS
    Spaces = {a, b, c}
    Creator = a
    Slots = {1, 2}
    BUGGY_HANDOVER_NO_OWED = TRUE
    BUGGY_NO_ADOPT = FALSE
    BUGGY_FORK_COPIES_PAYER = FALSE
    BUGGY_LOSER_KEEPS_CHARGE = FALSE
    BUGGY_UNMAP_RELEASES = FALSE
    BUGGY_NO_LAPSE = FALSE
    BUGGY_UNMAP_LAPSES = FALSE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT Shape
INVARIANT RecordIsResidency
INVARIANT ChargeExact
