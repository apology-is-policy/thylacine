\* The clean model: the range detach and the D-3b replace both release a
\* slot's page BEFORE the slot stops being mapped, so page_count == RSS at
\* every step and no resident page is ever unreachable. Explores the whole
\* space; the distinct-state count is the additivity fingerprint
\* check-capacity.sh pins.
CONSTANTS
    Slots = {s1, s2, s3, s4}
    BUGGY_REPLACE_KEEPS_ORPHANS = FALSE
    BUGGY_DETACH_NO_REFUND = FALSE
SPECIFICATION Spec
INVARIANT Invariants
