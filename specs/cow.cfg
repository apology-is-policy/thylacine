\* LINEAGE L-4 -- copy-on-write address-space sharing (ARCH 28 I-44), the
\* CORRECT protocol. The break decides under the Burrow lock in one atomic
\* step, pins across the copy, and drops the share only once the copy is done;
\* the vfork parent checks and parks under one lock.
\* Three sharers for coverage; the buggy cfgs use two, where each bug already
\* manifests and the counterexample is minimal.
\* Expected: TLC-green on Safety and on the EventuallyReleased liveness.
CONSTANTS
    Sharers = {s1, s2, s3}
    BUGGY_BREAK_UNLOCKED = FALSE
    BUGGY_TEARDOWN_NO_PIN = FALSE
    BUGGY_VFORK_OBSERVE_BEFORE_PARK = FALSE
    ALLOW_PROTECT = FALSE
    Pieces = 1
    BUGGY_PROTECT_KEEPS_PTE = FALSE
    BUGGY_FAULT_IGNORES_PROT = FALSE
    BUGGY_CLONE_PER_PIECE = FALSE
SPECIFICATION Spec
INVARIANT Safety
PROPERTY EventuallyReleased
