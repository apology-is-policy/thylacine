\* Warp WSI W-3b -- the COMPOSE-DRAIN counterexample. BUGGY_PDRAIN_SKIPPED
\* drops exactly the PDrained conjunct from PServerRelease and PFree,
\* modelling a teardown that unbinds the scanout (the standing observer) and
\* is BLIND to the transient one: a host compose -- the C-3 cross-ctx blit or
\* the C-6 readback's source read -- still reading the presentable's resource
\* when the blob is unref'd. The fourth-class twin of BUGGY_DRAIN_SKIPPED and
\* BUGGY_READBACK_FREE: each new in-flight class must be named by its retire
\* path's drain, or the retire frees what the host still references.
\*
\* Expected: TLC reports NoTornPresentable violated (PRegister ->
\* PComposeIssue -> PDestroy -> PClientRelease -> PServerRelease -> PFree:
\* "gone" + unbacked with the compose still reading).
