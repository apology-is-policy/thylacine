\* debug_stop_buggy_tail_latch_erets.cfg -- the tail's stop park leaves on a
\* latched interrupt and the tail erets, as it did before DEBUG-FS-DESIGN 5g: a
\* confirmed-stopped Thread sent an interrupt runs at EL0 with its stop still
\* set and the debugger still holding its confirmation. The note is delivered
\* only on the sync tail, so a compute-bound Thread keeps running stopped. With
\* one Thread the confirmation covers the target, so NoEL0AfterStopped fails in
\* the same state.
\* Expected: NoLostStop VIOLATED.
CONSTANTS
    Threads = {t1}
    BUGGY_STOP_BEFORE_DIE = FALSE
    BUGGY_OBSERVE_BEFORE_REGISTER = FALSE
    BUGGY_DOUBLE_WAKE = FALSE
    BUGGY_STRAND_ON_CLOSE = FALSE
    BUGGY_FAULT_STOP_UNGATED = FALSE
    BUGGY_STOP_SKIPS_SLEEPER = FALSE
    BUGGY_EXITKILL_IGNORED = FALSE
    HELD = FALSE
    BUGGY_HELD_RUNS_FREE = FALSE
    BUGGY_CONVERT_CLEARS_FIRST = FALSE
    BUGGY_ORPHAN_HOLD_STRANDS = FALSE
    BUGGY_BIRTH_WAIT_UNWOKEN = FALSE
    BUGGY_NO_DEATH_RECHECK = FALSE
    BUGGY_BIRTH_LATCH_ERETS = FALSE
    BUGGY_TAIL_LATCH_ERETS = TRUE
    BUGGY_LATCH_ENDS_STOP = FALSE
    BUGGY_SPAWNER_LATCH_RETURNS = FALSE
SPECIFICATION Spec
INVARIANT NoLostStop
