\* Warp-C C-1 -- the COMPOSED liveness witness. The load-bearing question a
\* real drain raises is not safety but TERMINATION: a drain that blocks
\* forever strands the weave just as surely as no drain corrupts it, and the
\* stage-0 synchronous mechanism could not deadlock because it had nothing to
\* wait on. Spec_Live adds weak fairness on ComposeComplete (the composition
\* fence retiring) alongside the existing drain actions.
\*
\* EventuallyRetired: a destroy still always drains to full teardown, now with
\* a composition blit possibly in flight when the destroy lands. What makes it
\* terminate is that ComposeBlit requires wstate = "live", so a retiring
\* generation issues no NEW blits and the outstanding one drains.
\* Expected: TLC-green.
SPECIFICATION Spec_Live

CONSTANTS
    ALLOW_DESTROY            = TRUE
    ALLOW_REWEAVE            = TRUE
    ALLOW_SERVER_DEATH       = TRUE
    ALLOW_COMPOSE            = TRUE
    BUGGY_EARLY_FREE         = FALSE
    BUGGY_RETIRE_NO_QUIESCE  = FALSE
    BUGGY_REWEAVE_NO_QUIESCE = FALSE
    BUGGY_STALE_MAP          = FALSE
    BUGGY_DRAIN_SKIPPED      = FALSE
    BUGGY_BLIT_DURING_FILL   = FALSE
    BUGGY_FILL_DURING_BLIT   = FALSE
    BUGGY_READBACK_FREE      = FALSE
    ALLOW_PRESENTABLE        = FALSE
    BUGGY_PUNBIND_SKIPPED    = FALSE
    BUGGY_PDRAIN_SKIPPED     = FALSE

INVARIANTS
    Invariants

PROPERTIES
    EventuallyRetired
