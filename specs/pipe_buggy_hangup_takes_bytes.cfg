\* BUGGY_HANGUP_TAKES_BYTES: a hung-up write end still takes bytes.
\* Counterexample: HangupWrite, then an append -> the ring grows after
\* EOF. The action property NoByteAfterEof is violated.

SPECIFICATION Spec

CONSTANTS
    Threads                              = {t1, t2}
    CAP                                  = 2
    BUGGY_WRITE_NO_WAKE_READER           = FALSE
    BUGGY_READ_NO_WAKE_WRITER            = FALSE
    BUGGY_CLOSE_WRITE_NO_WAKE_READER     = FALSE
    BUGGY_CLOSE_READ_NO_WAKE_WRITER      = FALSE
    BUGGY_WAKE_ONE_READER                = FALSE
    BUGGY_HANGUP_NO_WAKE_WRITER          = FALSE
    BUGGY_HANGUP_TAKES_BYTES             = TRUE

INVARIANTS
    Invariants

PROPERTIES
    NoByteAfterEof
