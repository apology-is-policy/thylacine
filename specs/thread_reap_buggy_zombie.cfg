\* Thread-model C3 -- ZOMBIE published in a g_proc_table_lock hold before the last
\* thread's EXITING commit (BUGGY_ZOMBIE_BEFORE_COMMIT), so wait_pid can see a
\* ZOMBIE with a thread not yet EXITING (wait_pid_for extincts on that).
\* Expected: ZombieImpliesAllExiting VIOLATED.
CONSTANTS
    Threads = {t1, t2, t3}
    Main = t1
    Cap = 3
    BUGGY_ADMIT_SPLIT = FALSE
    BUGGY_COUNT_SPLIT = FALSE
    BUGGY_SPAWNER_FREE = FALSE
    BUGGY_ZOMBIE_BEFORE_COMMIT = TRUE
SPECIFICATION Spec
INVARIANT ZombieImpliesAllExiting
