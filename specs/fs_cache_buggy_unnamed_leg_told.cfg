\* BUGGY_UNNAMED_LEG_TOLD (before vote M35): fs_cache_reuse_unnamed.cfg with an open
\* with no name answering its fsync with a named holder's refusal from its leg.
\* Expected: NoMisdirectedLeg VIOLATED (as NoMisdirectedLoss) -- the new file's
\* unnamed open's leg takes the deleted file's holder's refused run.
SPECIFICATION Spec

CONSTANTS
    Files                   = {f1}
    Capacity                = 1
    MaxCvers                = 3
    EnableExternalWriter    = FALSE
    BUGGY_STALE_SERVE       = FALSE
    BUGGY_NO_OWN_INVALIDATE = FALSE
    EnableStaging           = TRUE
    BUGGY_READ_SKIPS_STAGED = FALSE
    BUGGY_LOST_STAGE        = FALSE
    EnableFlushPopulate     = TRUE
    BUGGY_POPULATE_UNFLUSHED = FALSE
    Opens                   = {o1, o2}
    BUGGY_PEER_SKIPS_STAGED = FALSE
    BUGGY_PEER_WRITE_UNORDERED = FALSE
    BUGGY_SKIP_KEEPS_ENTRY = FALSE
    BUGGY_NO_PIN = FALSE
    EnableReuse = TRUE
    MaxGen = 2
    BUGGY_NUMBER_KEY = FALSE
    BUGGY_UNNAMED_WALK = FALSE
    BUGGY_NUMBER_SERVE = FALSE
    EnableUnnamed = TRUE
    BUGGY_UNNAMED_SERVE = FALSE
    BUGGY_UNNAMED_LEG_TOLD = TRUE
    BUGGY_UNNAMED_MARKS_SEEN = FALSE
    EnableExternalReuse = FALSE
    BUGGY_SERVE_OLDER = FALSE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    TypeOk
    CacheNeverAhead
    ServerNeverAhead
    Bounded
    NoStalePastRevalidation
    NoWrongRead
    NoLostStage
    OneHolder
    NamesTrue
    RecordsTrue
    DeadStateSkipped
    NoMisdirectedLoss
    NoMisdirectedSeen
    CacheOfLiveFile
