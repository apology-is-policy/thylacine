\* BUGGY (the design before #98): a zero-timeout poll of a ready
\* socket reads an empty cache and returns 0.
SPECIFICATION Spec

CONSTANTS
    HAS_TIMEOUT                  = TRUE
    HUNG_SERVER                  = FALSE
    ARM_MAY_FAIL                 = FALSE
    BUGGY_CACHE_ONLY_SAMPLE      = TRUE
    BUGGY_SETTLE_CUT_BY_DEADLINE = FALSE
    BUGGY_GC_SNAPSHOT            = FALSE
    BUGGY_LOST_READY             = FALSE
    BUGGY_EDGE_ARM               = FALSE
    BUGGY_NO_RETRY               = FALSE

INVARIANTS
    NoFalseNotReady
