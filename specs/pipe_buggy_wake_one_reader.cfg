\* BUGGY_WAKE_ONE_READER: WriteAppend wakes ONE chosen reader instead of
\* every hook (the single-waiter wakeup kept after the endpoints became
\* shared). Counterexample: ReadSleep(t1) + ReadSleep(t2) +
\* BuggyWriteAppendWakeOne(t3) -> one reader stuck in WAITING_READ while
\* ringCount > 0 (CanRead = TRUE). NoStuckReader violated. Needs three
\* threads (two sleepers + a writer).

SPECIFICATION Spec

CONSTANTS
    Threads                              = {t1, t2, t3}
    CAP                                  = 2
    BUGGY_WRITE_NO_WAKE_READER           = FALSE
    BUGGY_READ_NO_WAKE_WRITER            = FALSE
    BUGGY_CLOSE_WRITE_NO_WAKE_READER     = FALSE
    BUGGY_CLOSE_READ_NO_WAKE_WRITER      = FALSE
    BUGGY_WAKE_ONE_READER                = TRUE

INVARIANTS
    Invariants
