\* Vote M23 observing-leg counterexample (audit round 4 of M15, F1): open o1
\* holds a stage of f; a read through open o2, which holds none, serves the
\* cache -- the file as of its last flush -- instead of flushing o1's run
\* first. Expected: NoWrongRead is VIOLATED (the served token lags the
\* client's content). Pins LARDER-DESIGN 12.6: before another open's read,
\* open or stat of a file, its held bytes are flushed.
SPECIFICATION Spec

