\* Vote M23 changing-leg counterexample: open o1 holds a stage of f; open o2
\* writes f through without landing o1's run first. Expected: NoWrongRead is
\* VIOLATED -- o1's own read serves its OLDER token over the newer write (the
\* first violation TLC finds). With NoWrongRead left out, o1's flush lands the
\* older token over the newer write and NoLostStage is violated instead (no
\* stage held, the server lagging the client's content). Pins LARDER-DESIGN
\* 12.6: before a write, truncate or wstat through another open, the held
\* bytes land and the holder stops staging.
SPECIFICATION Spec

CONSTANTS
    Files                   = {f1, f2}
    Capacity                = 1
    MaxCvers                = 3
    EnableExternalWriter    = FALSE
    BUGGY_STALE_SERVE       = FALSE
    BUGGY_NO_OWN_INVALIDATE = FALSE
    EnableStaging           = TRUE
    BUGGY_READ_SKIPS_STAGED = FALSE
    BUGGY_LOST_STAGE        = FALSE
    EnableFlushPopulate     = FALSE
    BUGGY_POPULATE_UNFLUSHED = FALSE
    Opens                   = {o1, o2}
    BUGGY_PEER_SKIPS_STAGED = FALSE
    BUGGY_PEER_WRITE_UNORDERED = TRUE
    BUGGY_SKIP_KEEPS_ENTRY = FALSE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    SafetyCore
    NoWrongRead
    NoLostStage
    OneHolder
