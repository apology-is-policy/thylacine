\* debug_stop_buggy_no_death_recheck_tail.cfg -- the tail's stop park proceeds
\* on its wake condition without re-checking death (the birth park's twin is
\* debug_stop_buggy_no_death_recheck.cfg; the impl runs both through one loop).
\* The EXITKILL release terminates and only then clears the stop, so a stopped
\* Thread that passed the loop's death check just before the terminate reads
\* the cleared stop and erets into a dying group.
\* Expected: NoEretIntoDeath VIOLATED.
CONSTANTS
    Threads = {t1, t2}
    BUGGY_STOP_BEFORE_DIE = FALSE
    BUGGY_OBSERVE_BEFORE_REGISTER = FALSE
    BUGGY_DOUBLE_WAKE = FALSE
    BUGGY_STRAND_ON_CLOSE = FALSE
    BUGGY_FAULT_STOP_UNGATED = FALSE
    BUGGY_STOP_SKIPS_SLEEPER = FALSE
    BUGGY_EXITKILL_IGNORED = FALSE
    HELD = FALSE
    BUGGY_HELD_RUNS_FREE = FALSE
    BUGGY_CONVERT_CLEARS_FIRST = FALSE
    BUGGY_ORPHAN_HOLD_STRANDS = FALSE
    BUGGY_BIRTH_WAIT_UNWOKEN = FALSE
    BUGGY_NO_DEATH_RECHECK = TRUE
    BUGGY_BIRTH_LATCH_ERETS = FALSE
    BUGGY_TAIL_LATCH_ERETS = FALSE
    BUGGY_LATCH_ENDS_STOP = FALSE
    BUGGY_SPAWNER_LATCH_RETURNS = FALSE
SPECIFICATION Spec
PROPERTY NoEretIntoDeath
