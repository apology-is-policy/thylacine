\* Thread-model C1 -- an old reaper left beside the resume path
\* (BUGGY_TWO_REAPERS): the create-time sweep, exec's reap or wait_pid's walk
\* still frees a dead thread it finds on the list. It claims by the unlink, but
\* the resume path does not claim (it is meant to be the only reaper), so the
\* thread is freed twice.
\* Expected: ExactlyOnce VIOLATED.
CONSTANTS
    Threads = {t1, t2, t3}
    Main = t1
    Cap = 3
    NoThread = NoThread
    BUGGY_ADMIT_SPLIT = FALSE
    BUGGY_COUNT_SPLIT = FALSE
    BUGGY_SPAWNER_FREE = FALSE
    BUGGY_ZOMBIE_BEFORE_COMMIT = FALSE
    BUGGY_FREE_ON_CPU = FALSE
    BUGGY_TWO_REAPERS = TRUE
    BUGGY_EXEC_EARLY = FALSE
    BUGGY_WAITPID_UNLOCKED = FALSE
    BUGGY_REAP_AT_SPAWN = FALSE
    BUGGY_CAP_COUNTS_EXITED = FALSE
    BUGGY_EXEC_PERTHREAD = FALSE
    BUGGY_DOOM_MISSED = FALSE
SPECIFICATION Spec
INVARIANT ExactlyOnce
