\* debug_stop_spawn.cfg -- CLEAN, a spawn mid-run (thread-model C7, F-7): t1 runs
\* from the start and may spawn t2 at any time, inside a stop or out of one,
\* before a death or (refused) after it. The spawned Thread's first entry runs
\* the EL0-return tail before its first instruction, so one born into a stop
\* parks (NoEL0BornStopped) and every stop property still holds over the
\* Threads on the list (Live).
\* Expected: TLC-green.
CONSTANTS
    Threads = {t1, t2}
    BUGGY_STOP_BEFORE_DIE = FALSE
    BUGGY_OBSERVE_BEFORE_REGISTER = FALSE
    BUGGY_DOUBLE_WAKE = FALSE
    BUGGY_STRAND_ON_CLOSE = FALSE
    BUGGY_FAULT_STOP_UNGATED = FALSE
    BUGGY_STOP_SKIPS_SLEEPER = FALSE
    BUGGY_EXITKILL_IGNORED = FALSE
    HELD = FALSE
    BUGGY_HELD_RUNS_FREE = FALSE
    BUGGY_CONVERT_CLEARS_FIRST = FALSE
    BUGGY_ORPHAN_HOLD_STRANDS = FALSE
    BUGGY_BIRTH_WAIT_UNWOKEN = FALSE
    BUGGY_NO_DEATH_RECHECK = FALSE
    BUGGY_BIRTH_LATCH_ERETS = FALSE
    BUGGY_TAIL_LATCH_ERETS = FALSE
    BUGGY_LATCH_ENDS_STOP = FALSE
    BUGGY_SPAWNER_LATCH_RETURNS = FALSE
    Spawned = {t2}
    BUGGY_SPAWN_AT_EL0 = FALSE
SPECIFICATION Spec
INVARIANT Safety
PROPERTIES
    EventuallyAllDead
    EventuallyResumed
    EventuallyLaunchedDies
    EventuallyStopSettles
    NoEretIntoDeath
    ParkEndsOnlyInDeath
