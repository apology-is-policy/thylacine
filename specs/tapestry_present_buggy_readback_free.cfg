\* Warp-C C-6 -- the READBACK-drain counterexample. BUGGY_READBACK_FREE drops
\* exactly the DrainedOfReadbacks conjunct from ServerRelease and Free,
\* modelling a retire path that drains the direct-path class (#898) and the
\* blit class (C-1) and is blind to the third in-flight class C-6 adds: a
\* compositor readback -- a host DMA WRITE of the client's frame into the
\* generation's guest pages -- still landing when the pages are freed. The
\* blit case (BUGGY_DRAIN_SKIPPED) freed pages a device was READING; this frees
\* pages a device is WRITING, so it is the graver of the two composed-path
\* UAFs, and it becomes reachable at exactly the sub-chunk that takes the
\* readback off the present dispatch (C-6): while the readback was synchronous
\* it could not outlive the dispatch that issued it.
\*
\* Expected: TLC reports NoTornReadback violated (measured trace, 11 states:
\* WeaveFirst -> Map -> Draw -> Submit -> Complete [filled] -> ClunkMap ->
\* ComposeReadbackIssue -> Destroy -> ServerRelease -> Free: the pages are
\* freed with the readback still landing in them).
