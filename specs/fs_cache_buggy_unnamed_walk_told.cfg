\* fs_cache_buggy_unnamed_walk.cfg with DeadStateSkipped and NoWrongRead left
\* out (a dead open named by number alone is served the new file's entry, a
\* counterexample as short). Expected: NoMisdirectedLoss VIOLATED -- an open
\* named by number alone matches another incarnation's, and an fsync is told
\* that incarnation's refused run (TLC's shortest: a deleted file's open's leg
\* meets the new file's holder so named).
SPECIFICATION Spec

CONSTANTS
    Files                   = {f1, f2}
    Capacity                = 1
    MaxCvers                = 3
    EnableExternalWriter    = FALSE
    BUGGY_STALE_SERVE       = FALSE
    BUGGY_NO_OWN_INVALIDATE = FALSE
    EnableStaging           = TRUE
    BUGGY_READ_SKIPS_STAGED = FALSE
    BUGGY_LOST_STAGE        = FALSE
    EnableFlushPopulate     = TRUE
    BUGGY_POPULATE_UNFLUSHED = FALSE
    Opens                   = {o1, o2}
    BUGGY_PEER_SKIPS_STAGED = FALSE
    BUGGY_PEER_WRITE_UNORDERED = FALSE
    BUGGY_SKIP_KEEPS_ENTRY = FALSE
    BUGGY_NO_PIN = FALSE
    EnableReuse = TRUE
    MaxGen = 2
    BUGGY_NUMBER_KEY = FALSE
    BUGGY_UNNAMED_WALK = TRUE
    BUGGY_NUMBER_SERVE = FALSE
    EnableUnnamed = FALSE
    BUGGY_UNNAMED_SERVE = FALSE
    BUGGY_UNNAMED_LEG_TOLD = FALSE
    BUGGY_UNNAMED_MARKS_SEEN = FALSE
    EnableExternalReuse = FALSE
    BUGGY_SERVE_OLDER = FALSE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    TypeOk
    CacheNeverAhead
    ServerNeverAhead
    Bounded
    NoStalePastRevalidation
    NoLostStage
    OneHolder
    NamesTrue
    RecordsTrue
    NoMisdirectedLoss
    NoMisdirectedSeen
    CacheOfLiveFile
