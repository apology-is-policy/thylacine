\* Thread-model C6 -- an exec from a non-main thread takes the pid as its tid
\* in its CLAIM's hold (BUGGY_PID_AT_CLAIM), not at the swap: the old main
\* thread, doomed but still on the list, holds the same tid, so a lookup of the
\* pid as a tid can find either.
\* Expected: PidNamesOne VIOLATED.
CONSTANTS
    Threads = {t1, t2, t3}
    Main = t1
    Cap = 3
    NoThread = NoThread
    BUGGY_ADMIT_SPLIT = FALSE
    BUGGY_COUNT_SPLIT = FALSE
    BUGGY_SPAWNER_FREE = FALSE
    BUGGY_ZOMBIE_BEFORE_COMMIT = FALSE
    BUGGY_FREE_ON_CPU = FALSE
    BUGGY_TWO_REAPERS = FALSE
    BUGGY_EXEC_EARLY = FALSE
    BUGGY_WAITPID_UNLOCKED = FALSE
    BUGGY_REAP_AT_SPAWN = FALSE
    BUGGY_CAP_COUNTS_EXITED = FALSE
    BUGGY_EXEC_PERTHREAD = FALSE
    BUGGY_DOOM_MISSED = FALSE
    BUGGY_PID_AT_CLAIM = TRUE
SPECIFICATION Spec
INVARIANT PidNamesOne
