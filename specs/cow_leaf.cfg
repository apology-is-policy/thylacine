\* B-1a' -- the read-only leaf and the break's two-step tail (MODEL_LEAF), the
\* CORRECT order: the copy's writable leaf replaces the read-only one in place,
\* THEN the share held across the copy is put. Three sharers, as cow.cfg.
\* Expected: TLC-green on Safety + LeafSafety and on EventuallyReleased.
CONSTANTS
    Sharers = {s1, s2, s3}
    BUGGY_BREAK_UNLOCKED = FALSE
    BUGGY_TEARDOWN_NO_PIN = FALSE
    BUGGY_VFORK_OBSERVE_BEFORE_PARK = FALSE
    ALLOW_PROTECT = FALSE
    Pieces = 1
    BUGGY_PROTECT_KEEPS_PTE = FALSE
    BUGGY_FAULT_IGNORES_PROT = FALSE
    BUGGY_CLONE_PER_PIECE = FALSE
    MODEL_LEAF = TRUE
    BUGGY_PUT_BEFORE_REPLACE = FALSE
SPECIFICATION Spec
INVARIANT Safety
INVARIANT LeafSafety
PROPERTY EventuallyReleased
