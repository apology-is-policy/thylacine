\* Two spaces mint the same slot; the one that loses the install keeps
\* its mint charge. The payer pays the record exactly -- the record is
\* what is wrong: it counts a page that does not exist, and the free
\* will refund it. ChargeExact is listed AHEAD and must HOLD.
\* Expected: RecordIsResidency VIOLATED at the losing Install.
CONSTANTS
    Spaces = {a, b, c}
    Creator = a
    Slots = {1, 2}
    BUGGY_HANDOVER_NO_OWED = FALSE
    BUGGY_NO_ADOPT = FALSE
    BUGGY_FORK_COPIES_PAYER = FALSE
    BUGGY_LOSER_KEEPS_CHARGE = TRUE
    BUGGY_UNMAP_RELEASES = FALSE
    BUGGY_NO_LAPSE = FALSE
    BUGGY_UNMAP_LAPSES = FALSE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT Shape
INVARIANT ChargeExact
INVARIANT RecordIsResidency
