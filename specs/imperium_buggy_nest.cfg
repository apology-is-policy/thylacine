\* The NESTED PROPAGATING redeem admitted (G6's second half): a PROPAGATING
\* grant redeemed by a Proc already in a scope is taken as a further redeem
\* that also turns propagation on and widens the flowing set -- a member of a
\* plain legate scope starts elevating its children, or a member of an
\* imperium scope widens what its children receive beyond the root's grant.
\* The design REFUSES it (propagating never nests; abdicate first).
\* Expected: TLC reports ScopeTraitsSetOnce violated
\* (RedeemFresh -> BuggyRedeemNest).
CONSTANTS
    Procs     = {p1, p2}
    Caps      = {c1, c2}
    MaxScopes = 2
    BUGGY_STRAGGLER         = FALSE
    BUGGY_RETAG             = FALSE
    BUGGY_FLOW_WITHOUT_FLAG = FALSE
    BUGGY_NEST_ADMITTED     = TRUE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT ScopeTraitsSetOnce
