\* debug_stop_held.cfg -- CLEAN, the birth hold (DEBUG-FS-DESIGN 5f): a child
\* spawned held parks before its first instruction; the debugger's stop converts
\* the hold (deliver, then clear); start and an explicit detach release it; the
\* implicit release keeps it; the spawner's birth wait returns once the child is
\* parked, released or dead; a spawner that dies holding it takes the child.
\* An interrupt latched on the held child leaves it held until it is released,
\* converted and resumed, or killed (ParkEndsOnlyInDeath); one latched on the
\* spawner does not end the birth wait (SpawnReturnsAfterBirth, in Safety).
\* One Thread: a held child has executed nothing, so it has made no others.
\* Expected: TLC-green.
CONSTANTS
    Threads = {t1}
    BUGGY_STOP_BEFORE_DIE = FALSE
    BUGGY_OBSERVE_BEFORE_REGISTER = FALSE
    BUGGY_DOUBLE_WAKE = FALSE
    BUGGY_STRAND_ON_CLOSE = FALSE
    BUGGY_FAULT_STOP_UNGATED = FALSE
    BUGGY_STOP_SKIPS_SLEEPER = FALSE
    BUGGY_EXITKILL_IGNORED = FALSE
    HELD = TRUE
    BUGGY_HELD_RUNS_FREE = FALSE
    BUGGY_CONVERT_CLEARS_FIRST = FALSE
    BUGGY_ORPHAN_HOLD_STRANDS = FALSE
    BUGGY_BIRTH_WAIT_UNWOKEN = FALSE
    BUGGY_NO_DEATH_RECHECK = FALSE
    BUGGY_BIRTH_LATCH_ERETS = FALSE
    BUGGY_TAIL_LATCH_ERETS = FALSE
    BUGGY_LATCH_ENDS_STOP = FALSE
    BUGGY_SPAWNER_LATCH_RETURNS = FALSE
SPECIFICATION Spec
INVARIANT Safety
PROPERTIES
    EventuallyAllDead
    EventuallyResumed
    EventuallyLaunchedDies
    EventuallyStopSettles
    EventuallyHoldResolved
    BirthWaitReleases
    HoldMonotone
    NoEretIntoDeath
    ParkEndsOnlyInDeath
