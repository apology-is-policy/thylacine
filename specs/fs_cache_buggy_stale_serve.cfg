\* BUGGY_STALE_SERVE counterexample -- Open skips the cvers==current check, so
\* an open trusts a stale entry (marks it validated without refetching). With an
\* external writer to create the stale entry, NoStalePastRevalidation fails: a
\* validated entry whose cvers lags the server. Expected: TLC reports a
\* NoStalePastRevalidation violation (open populate; external write; buggy open
\* keeps the stale entry validated).
SPECIFICATION Spec

CONSTANTS
    Files                   = {f1, f2}
    Capacity                = 1
    MaxCvers                = 2
    EnableExternalWriter    = TRUE
    BUGGY_STALE_SERVE       = TRUE
    BUGGY_NO_OWN_INVALIDATE = FALSE
    EnableStaging           = FALSE
    BUGGY_READ_SKIPS_STAGED = FALSE
    BUGGY_LOST_STAGE        = FALSE
    EnableFlushPopulate     = FALSE
    BUGGY_POPULATE_UNFLUSHED = FALSE
    Opens                   = {o1}
    BUGGY_PEER_SKIPS_STAGED = FALSE
    BUGGY_PEER_WRITE_UNORDERED = FALSE
    BUGGY_SKIP_KEEPS_ENTRY = FALSE
    BUGGY_NO_PIN = FALSE
    EnableReuse = FALSE
    MaxGen = 0
    BUGGY_NUMBER_KEY = FALSE
    BUGGY_UNNAMED_WALK = FALSE
    BUGGY_NUMBER_SERVE = FALSE
    EnableUnnamed = FALSE
    BUGGY_UNNAMED_SERVE = FALSE
    BUGGY_UNNAMED_LEG_TOLD = FALSE
    BUGGY_UNNAMED_MARKS_SEEN = FALSE
    EnableExternalReuse = FALSE
    BUGGY_SERVE_OLDER = FALSE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    TypeOk
    CacheNeverAhead
    Bounded
    NoStalePastRevalidation
