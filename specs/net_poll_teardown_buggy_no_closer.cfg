\* BUGGY (the design before 2026-09-28): safety holds, but Liveness FAILS. A
\* thread whose Proc is dying cannot send, and its close's Tclunk was refused
\* and never sent: nothing else clunks the fid, so the slot leaks until the
\* session ends. Fixed by handing the Tclunk to the closer threads
\* (docs/FID-LIFECYCLE-DESIGN.md section 9), whose CloserSend is fair.
SPECIFICATION Spec

CONSTANTS
    Fix = TRUE
    BUGGY_SPLIT_GC = FALSE
    NO_CLOSER = TRUE

INVARIANTS
    SafetyInvariants

PROPERTIES
    Liveness
