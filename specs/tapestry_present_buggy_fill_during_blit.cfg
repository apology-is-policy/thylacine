\* Warp-C C-1 -- the ORDERING counterexample, fill-during-blit direction. The
\* client fills the host resource while a composition blit is still reading
\* it: the buffer-in-use violation, i.e. the composed-path extension of the D1
\* recycle gate.
\*
\* This direction exists as its own cfg because the exclusion is SYMMETRIC and
\* a single flag opening both gates would only ever demonstrate whichever end
\* TLC reached first. It is also the direction that is easy to miss in the
\* impl, because the pre-Warp-C release rule still LOOKS sufficient: in the
\* direct path a slot is released by its present's terminal CQE, and that CQE
\* genuinely does mean the host has finished reading. Once the compositor is a
\* SECOND reader of the same host resource, the CQE stops meaning the resource
\* is free -- and nothing in the old rule notices.
\*
\* Worth stating precisely because the first draft of this model got it wrong:
\* guest-side slots do NOT make this safe. tapestryd allocates one 2D resource
\* per surface with whole-weave ATTACH_BACKING and transfers at a per-present
\* OFFSET, so filling a DIFFERENT slot still collides with the blit. Guest-side
\* double-buffering buys no host-side concurrency.
\*
\* Expected: TLC reports NoStaleCompose violated
\* (... -> ComposeBlit -> Draw -> Submit: the client refills the resource the
\* compositor is mid-blit on).
SPECIFICATION Spec

CONSTANTS
    ALLOW_DESTROY            = FALSE
    ALLOW_REWEAVE            = FALSE
    ALLOW_SERVER_DEATH       = FALSE
    ALLOW_COMPOSE            = TRUE
    BUGGY_EARLY_FREE         = FALSE
    BUGGY_RETIRE_NO_QUIESCE  = FALSE
    BUGGY_REWEAVE_NO_QUIESCE = FALSE
    BUGGY_STALE_MAP          = FALSE
    BUGGY_DRAIN_SKIPPED      = FALSE
    BUGGY_BLIT_DURING_FILL   = FALSE
    BUGGY_FILL_DURING_BLIT   = TRUE

INVARIANTS
    NoStaleCompose
