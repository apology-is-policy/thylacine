\* THE fork-vs-teardown race (G5): Fork admits a TERMINATING parent -- the
\* parent's group_exit_msg is not re-checked under the g_proc_table_lock hold
\* that links the child, so a child whose tag + caps were copied before the
\* root's teardown sweep walked past its parent lands in the table AFTER the
\* sweep: ALIVE + ELEVATED with no live root. Benign at v1.0 (members were
\* never elevated); load-bearing once caps propagate.
\* Expected: TLC reports NoElevatedOutlivesScope violated
\* (RedeemFresh(prop) -> Fork -> Exit(root) -> Fork-from-terminating).
CONSTANTS
    Procs     = {p1, p2, p3}
    Caps      = {c1}
    MaxScopes = 2
    BUGGY_STRAGGLER         = TRUE
    BUGGY_RETAG             = FALSE
    BUGGY_FLOW_WITHOUT_FLAG = FALSE
    BUGGY_NEST_ADMITTED     = FALSE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT NoElevatedOutlivesScope
