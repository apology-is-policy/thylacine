\* ARCH 8.8.1.1 (#90; the seam-90 close) -- the rule as built, under a server
\* that does send every chunk (FairServerSpec). The frame is delivered even when
\* the reader that began it left mid-frame: the survivor resumed it from the
\* client's count (FrameDelivered). The unwind and the stream's integrity hold
\* here too.
\* Expected: TLC-green.
CONSTANTS
    N = 3
    BUGGY_DISCARD = FALSE
    BUGGY_BLOCK_THROUGH = FALSE
SPECIFICATION FairServerSpec
INVARIANT Safety
PROPERTY FrameDelivered EventuallyUnwinds
