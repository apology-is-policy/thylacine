\* debug_stop.cfg -- CLEAN: die-check-first tail, register-then-observe stop
\* handshake, single-wake resume latch, and handle-lifetime-tied slot release.
\* The debugger's confirm is sound (NoLostStop), the frozen window is real
\* (NoEL0AfterStopped), a parked Thread is woken at most once (ExactlyOnceResume);
\* death always completes even against a held stop (EventuallyAllDead), and a
\* released / dead debugger never strands its target (EventuallyResumed); a
\* park never erets a Thread whose group termination is published
\* (NoEretIntoDeath); and a latched interrupt ends no parked Thread
\* (ParkEndsOnlyInDeath) and moves no confirmed-stopped one (NoLostStop,
\* NoEL0AfterStopped): DEBUG-FS-DESIGN 5g.
\* Expected: TLC-green.
CONSTANTS
    Threads = {t1, t2}
    BUGGY_STOP_BEFORE_DIE = FALSE
    BUGGY_OBSERVE_BEFORE_REGISTER = FALSE
    BUGGY_DOUBLE_WAKE = FALSE
    BUGGY_STRAND_ON_CLOSE = FALSE
    BUGGY_FAULT_STOP_UNGATED = FALSE
    BUGGY_STOP_SKIPS_SLEEPER = FALSE
    BUGGY_EXITKILL_IGNORED = FALSE
    HELD = FALSE
    BUGGY_HELD_RUNS_FREE = FALSE
    BUGGY_CONVERT_CLEARS_FIRST = FALSE
    BUGGY_ORPHAN_HOLD_STRANDS = FALSE
    BUGGY_BIRTH_WAIT_UNWOKEN = FALSE
    BUGGY_NO_DEATH_RECHECK = FALSE
    BUGGY_BIRTH_LATCH_ERETS = FALSE
    BUGGY_TAIL_LATCH_ERETS = FALSE
    BUGGY_LATCH_ENDS_STOP = FALSE
    BUGGY_SPAWNER_LATCH_RETURNS = FALSE
SPECIFICATION Spec
INVARIANT Safety
PROPERTIES
    EventuallyAllDead
    EventuallyResumed
    EventuallyLaunchedDies
    EventuallyStopSettles
    NoEretIntoDeath
    ParkEndsOnlyInDeath
