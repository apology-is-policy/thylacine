\* BUG 2 -- break-vs-teardown. The breaker drops its share BEFORE copying and
\* takes no pin, so a concurrent sharer exit drives the count to zero and frees
\* the pristine page while the breaker is still reading out of it.
\* Expected: NoUseAfterFree VIOLATED.
CONSTANTS
    Sharers = {s1, s2}
    BUGGY_BREAK_UNLOCKED = FALSE
    BUGGY_TEARDOWN_NO_PIN = TRUE
    BUGGY_VFORK_OBSERVE_BEFORE_PARK = FALSE
    ALLOW_PROTECT = FALSE
    Pieces = 1
    BUGGY_PROTECT_KEEPS_PTE = FALSE
    BUGGY_FAULT_IGNORES_PROT = FALSE
    BUGGY_CLONE_PER_PIECE = FALSE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT NoUseAfterFree
