\* Warp WSI W-3b -- the UNBIND-ORDERING counterexample ("gap 7" proper,
\* WARP-WSI-DESIGN section 6). BUGGY_PUNBIND_SKIPPED drops exactly the
\* PUnbound conjunct from PServerRelease and PFree, modelling a teardown that
\* unrefs the presentable's blob without FIRST unbinding the display -- the
\* gl_evict_res ordering the weave side has always carried and the
\* presentable side never needed before W-3b. The display scanout is left
\* bound to a destroyed resource: on the documented-trusted host that is
\* host-side UAF / display corruption with cross-client blast radius (the
\* I-40 fourth-class violation).
\*
\* Expected: TLC reports NoTornPresentable violated (PRegister ->
\* PPresentBind -> PDestroy -> PClientRelease -> PServerRelease -> PFree:
\* "gone" + unbacked with the scanout binding still standing).
