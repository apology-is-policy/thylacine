\* BUG 3 -- the lost VFORK wake (L-3c-2, modeled retroactively). The parent
\* observes "has the child stopped sharing my address space?" OUTSIDE the lock
\* and parks afterwards, so a release landing in that window is lost and the
\* parent parks forever. Safety still holds -- this is a HANG, which is why the
\* witness has to be a liveness property.
\* Expected: EventuallyReleased VIOLATED (Safety still holds).
CONSTANTS
    Sharers = {s1, s2}
    BUGGY_BREAK_UNLOCKED = FALSE
    BUGGY_TEARDOWN_NO_PIN = FALSE
    BUGGY_VFORK_OBSERVE_BEFORE_PARK = TRUE
    ALLOW_PROTECT = FALSE
    Pieces = 1
    BUGGY_PROTECT_KEEPS_PTE = FALSE
    BUGGY_FAULT_IGNORES_PROT = FALSE
    BUGGY_CLONE_PER_PIECE = FALSE
SPECIFICATION Spec
INVARIANT Safety
PROPERTY EventuallyReleased
