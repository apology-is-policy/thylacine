\* BUGGY_UNNAMED_MARKS_SEEN (before audit round 10 of M15, F2): fs_cache_reuse_unnamed.cfg
\* with an open with no name marking the record its fsync reports as told. Expected:
\* NoMisdirectedSeen VIOLATED -- TLC's shortest: the new file's unnamed open is
\* told the deleted file's refused run by number and marks it told. A deleted file
\* takes no later opens; the same mark made by a deleted file's unnamed open on
\* the live file's record hides the loss from the live file's next opens.
