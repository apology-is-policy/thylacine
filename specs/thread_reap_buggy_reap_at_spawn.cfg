\* Thread-model C1 -- the 10-19 interim fix's shape (BUGGY_REAP_AT_SPAWN): the
\* resume path frees nothing, and a dead thread is freed only by the sweep the
\* next spawn runs. A program that stops spawning keeps its dead threads, and
\* their stacks, until it exits (seam-exited-threads-wait-for-a-create).
\* Expected: ExitedThreadsFreed VIOLATED (a temporal property).
CONSTANTS
    Threads = {t1, t2, t3}
    Main = t1
    Cap = 3
    BUGGY_ADMIT_SPLIT = FALSE
    BUGGY_COUNT_SPLIT = FALSE
    BUGGY_SPAWNER_FREE = FALSE
    BUGGY_ZOMBIE_BEFORE_COMMIT = FALSE
    BUGGY_FREE_ON_CPU = FALSE
    BUGGY_TWO_REAPERS = FALSE
    BUGGY_EXEC_EARLY = FALSE
    BUGGY_WAITPID_UNLOCKED = FALSE
    BUGGY_REAP_AT_SPAWN = TRUE
SPECIFICATION Spec
PROPERTY ExitedThreadsFreed
