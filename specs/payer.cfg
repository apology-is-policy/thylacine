\* The clean model: a record-paid Burrow shared by fork across three
\* address spaces, two pages. The payer pays every resident page (and a
\* page charged mid-install), each other sharer pays its leaves, the
\* payer's own leaves are free, a lapsed record is taken over whole by
\* the next minting faulter, and the free refunds the record. Explores
\* the whole space; the distinct- and generated-state counts are the
\* fingerprint check-payer.sh pins.
CONSTANTS
    Spaces = {a, b, c}
    Creator = a
    Slots = {1, 2}
    BUGGY_HANDOVER_NO_OWED = FALSE
    BUGGY_NO_ADOPT = FALSE
    BUGGY_FORK_COPIES_PAYER = FALSE
    BUGGY_LOSER_KEEPS_CHARGE = FALSE
    BUGGY_UNMAP_RELEASES = FALSE
    BUGGY_NO_LAPSE = FALSE
    BUGGY_UNMAP_LAPSES = FALSE
SPECIFICATION Spec
INVARIANT Invariants
