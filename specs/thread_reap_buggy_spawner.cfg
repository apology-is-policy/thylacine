\* Thread-model C3 -- a thread admitted with no RUNNING spawner (BUGGY_SPAWNER_FREE,
\* a kernel-side spawn into a user Proc): it joins while the last out is closing,
\* so the decision that let the closer drop every lock is no longer true.
\* Expected: CloseStable VIOLATED.
