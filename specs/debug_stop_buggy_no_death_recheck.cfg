\* debug_stop_buggy_no_death_recheck.cfg -- the birth park proceeds on its wake
\* condition without re-checking death. The EXITKILL release publishes the
\* terminate and only then clears the stop; a child that passed the loop's
\* death check just before the terminate reads the cleared stop and erets, so a
\* child dying with its launcher runs its first instructions first. The clean
\* held cfg found this against the first draft of the design (2026-09-29).
\* Expected: NoEL0WhileHeld VIOLATED.
CONSTANTS
    Threads = {t1}
    BUGGY_STOP_BEFORE_DIE = FALSE
    BUGGY_OBSERVE_BEFORE_REGISTER = FALSE
    BUGGY_DOUBLE_WAKE = FALSE
    BUGGY_STRAND_ON_CLOSE = FALSE
    BUGGY_FAULT_STOP_UNGATED = FALSE
    BUGGY_STOP_SKIPS_SLEEPER = FALSE
    BUGGY_EXITKILL_IGNORED = FALSE
    HELD = TRUE
    BUGGY_HELD_RUNS_FREE = FALSE
    BUGGY_CONVERT_CLEARS_FIRST = FALSE
    BUGGY_ORPHAN_HOLD_STRANDS = FALSE
    BUGGY_BIRTH_WAIT_UNWOKEN = FALSE
    BUGGY_NO_DEATH_RECHECK = TRUE
    BUGGY_BIRTH_LATCH_ERETS = FALSE
    BUGGY_TAIL_LATCH_ERETS = FALSE
    BUGGY_LATCH_ENDS_STOP = FALSE
    BUGGY_SPAWNER_LATCH_RETURNS = FALSE
SPECIFICATION Spec
INVARIANT NoEL0WhileHeld
