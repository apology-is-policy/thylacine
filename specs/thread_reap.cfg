\* XT-3b -- per-thread reaping, the CORRECT protocol. A retired Thread is freed
\* only once settled (on_cpu clear), by exactly one claimer; no tail runs in a
\* freed address space; a freed Proc holds no corpse; and every zombie, exec
\* drain and claim completes. Expected: TLC-green.
CONSTANTS
    Threads = {t1, t2, t3}
    Main = t1
    MaxGen = 2
    BUGGY_REAP_IGNORES_ONCPU = FALSE
    BUGGY_CLAIM_UNLOCKED = FALSE
    BUGGY_EXEC_NO_DRAIN = FALSE
    BUGGY_WAITPID_SKIPS_RETIRED = FALSE
    BUGGY_TID_AFTER_READY = FALSE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT NoFreeInFlight
INVARIANT OneFreerPerThread
INVARIANT NoTidReadAfterFree
INVARIANT TailsOnLiveSpace
INVARIANT LiveOnLiveSpace
INVARIANT RetiredAreExited
INVARIANT LiveListIsLive
INVARIANT NoLiveAfterZombie
INVARIANT FreedProcHoldsNone
PROPERTY EventuallyFreed
PROPERTY ExecCompletes
PROPERTY ClaimsDischarged
