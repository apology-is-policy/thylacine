\* Thread-model C3 -- the per-Proc thread lock, CORRECT protocol. Admission is
\* one threads_lock hold (claim + cap checked, then linked); a non-last exit
\* commits EXITING and decrements live_threads in one hold; the last out decides
\* under threads_lock, drops every lock to close its handles, then commits and
\* publishes ZOMBIE in one g_proc_table_lock hold. C1: each committed thread is
\* freed by the resume path of its final switch-out, exec waits until it is the
\* only thread on the list, and wait_pid frees only the Proc, once the thread
\* count read under the lock is zero. Four threads, cap 3, so the cap refusal
\* is reached.
\* Expected: TLC-green (Safety); EventuallyReaped and ExitedThreadsFreed hold.
CONSTANTS
    Threads = {t1, t2, t3, t4}
    Main = t1
    Cap = 3
    BUGGY_ADMIT_SPLIT = FALSE
    BUGGY_COUNT_SPLIT = FALSE
    BUGGY_SPAWNER_FREE = FALSE
    BUGGY_ZOMBIE_BEFORE_COMMIT = FALSE
    BUGGY_FREE_ON_CPU = FALSE
    BUGGY_TWO_REAPERS = FALSE
    BUGGY_EXEC_EARLY = FALSE
    BUGGY_WAITPID_UNLOCKED = FALSE
    BUGGY_REAP_AT_SPAWN = FALSE
SPECIFICATION Spec
INVARIANT Safety
PROPERTY EventuallyReaped
PROPERTY ExitedThreadsFreed
