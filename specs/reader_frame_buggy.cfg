\* ARCH 8.8.1.1 (#90) -- an unwind that DISCARDS the partial frame: the reader
\* before loom-mc, whose count was local to its frame read. A reader interrupted
\* mid-frame loses the count; the survivor parses from 0 while the wire is
\* mid-frame and reads the frame's tail as a header (the task-#50 class). This is
\* what the superseded block-through avoided, and what c->rx_got prevents now.
\* Expected: NoDesync VIOLATED.
CONSTANTS
    N = 3
    BUGGY_DISCARD = TRUE
    BUGGY_BLOCK_THROUGH = FALSE
SPECIFICATION Spec
INVARIANT NoDesync
