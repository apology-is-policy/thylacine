\* Caps FLOW at fork under a NON-propagating scope: the v1.0
\* `& ~CAP_ELEVATION_ONLY` strip removed wholesale instead of carved by the
\* PROPAGATING flag -- a plain (non-imperium) legate's children inherit its
\* elevated caps, which I-2 forbids.
\* Expected: TLC reports FlowOnlyUnderPropagating violated
\* (RedeemFresh(~prop) -> Fork).
CONSTANTS
    Procs     = {p1, p2}
    Caps      = {c1}
    MaxScopes = 2
    BUGGY_STRAGGLER         = FALSE
    BUGGY_RETAG             = FALSE
    BUGGY_FLOW_WITHOUT_FLAG = TRUE
    BUGGY_NEST_ADMITTED     = FALSE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT FlowOnlyUnderPropagating
