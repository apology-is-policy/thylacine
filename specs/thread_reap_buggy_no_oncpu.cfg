\* XT-3b bug 1: the reaper detaches a retired Thread whose switch away has not
\* completed (on_cpu still set) and frees it under its own tail.
\* Expected: NoFreeInFlight violated.
CONSTANTS
    Threads = {t1, t2, t3}
    Main = t1
    MaxGen = 2
    RoundMax = 1
    BUGGY_REAP_IGNORES_ONCPU = TRUE
    BUGGY_CLAIM_UNLOCKED = FALSE
    BUGGY_UNLINK_AT_CLAIM = FALSE
    BUGGY_EXEC_NO_DRAIN = FALSE
    BUGGY_WAITPID_SKIPS_RETIRED = FALSE
    BUGGY_TID_AFTER_READY = FALSE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT NoFreeInFlight
INVARIANT OneFreerPerThread
INVARIANT NoTidReadAfterFree
INVARIANT TailsOnLiveSpace
INVARIANT LiveOnLiveSpace
INVARIANT RetiredAreExited
INVARIANT LiveListIsLive
INVARIANT NoLiveAfterZombie
INVARIANT FreedProcHoldsNone
INVARIANT EveryThreadCounted
INVARIANT ClaimsHeldByLive
