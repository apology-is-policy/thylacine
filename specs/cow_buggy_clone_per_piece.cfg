\* BUG 6 -- one clone Burrow per VMA piece. addrspace_clone mints a clone per
\* VMA and a clone takes a share on EVERY resident page of its source, so once
\* a protect (or a D-3b MAP_FIXED window) has split one Burrow into 2 pieces
\* the child holds 2 shares of every page while being ONE holder. The count
\* lies from the fork onwards: the child is charged 2x resident and the parent
\* can never take a page in place while the phantom clone lives.
\* Expected: ShareIsHolderCount VIOLATED -- by the INITIAL state, which is
\* exactly where the bug is (the fork, not anything that follows it).
CONSTANTS
    Sharers = {s1, s2}
    BUGGY_BREAK_UNLOCKED = FALSE
    BUGGY_TEARDOWN_NO_PIN = FALSE
    BUGGY_VFORK_OBSERVE_BEFORE_PARK = FALSE
    ALLOW_PROTECT = TRUE
    Pieces = 2
    BUGGY_PROTECT_KEEPS_PTE = FALSE
    BUGGY_FAULT_IGNORES_PROT = FALSE
    BUGGY_CLONE_PER_PIECE = TRUE
    MODEL_LEAF = FALSE
    BUGGY_PUT_BEFORE_REPLACE = FALSE
SPECIFICATION SpecProtect
INVARIANT TypeOk
INVARIANT ShareIsHolderCount
