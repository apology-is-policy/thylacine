\* BUGGY: the marker survives the body into the EL0-return tail, so the tail
\* DEFERS instead of taking the reschedule the boundary owed it and the #107
\* syscall-return preempt never fires. The thread returns to EL0 still
\* carrying it. Not starvation -- the next EL0 interrupt takes it -- so
\* liveness cannot see this; it is a safety statement about the boundary.
\* Both other safety invariants still HOLD here, which is the point.
CONSTANTS
    KTHREAD                    = FALSE
    BUGGY_MARKER_IGNORED       = FALSE
    BUGGY_UNMASK_BEFORE_MARK   = FALSE
    BUGGY_LATE_REMASK          = FALSE
    BUGGY_MARKER_NEVER_CLEARED = TRUE
    BUGGY_MASKED_BODY          = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOk
    TailTookItsPreempt
