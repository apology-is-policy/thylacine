\* Warp-C C-1 -- the COMPOSED model, clean (GPU-DESIGN section 4.5). The
\* compositor owns a virgl context and a host-side screen resource; per frame
\* it blits each visible surface into the screen (VIRGL_CCMD_BLIT) in one
\* fenced submit, then SET_SCANOUT + RESOURCE_FLUSH. Per-frame guest<->host
\* pixel traffic becomes zero, deleting the measured 43% composed-path
\* overhead (#215).
\*
\* TLC proves the composed path upholds EVERY pre-Warp-C invariant unchanged
\* -- section 4.5.6 requires the drain to discharge ServerRelease and
\* NoStaleMap "as strongly as synchrony did", not an amendment to I-40 -- plus
\* the two C-1 additions: NoTornCompose (pages stay backed under an in-flight
\* composition blit) and NoStaleCompose (a blit never reads a slot whose
\* client write has not landed -- the P2 cross-context ordering hazard).
\* Expected: TLC-green.
