\* Thread-model C3 -- the live-count read and its decrement in two holds
\* (BUGGY_COUNT_SPLIT): two threads both read live = 2, both decide they are not
\* last, both commit EXITING, and nobody publishes ZOMBIE -- the Proc is never
\* reaped.
\* Expected: NoOrphanedProc VIOLATED.
CONSTANTS
    Threads = {t1, t2, t3}
    Main = t1
    Cap = 3
    BUGGY_ADMIT_SPLIT = FALSE
    BUGGY_COUNT_SPLIT = TRUE
    BUGGY_SPAWNER_FREE = FALSE
    BUGGY_ZOMBIE_BEFORE_COMMIT = FALSE
    BUGGY_FREE_ON_CPU = FALSE
    BUGGY_TWO_REAPERS = FALSE
    BUGGY_EXEC_EARLY = FALSE
    BUGGY_WAITPID_UNLOCKED = FALSE
    BUGGY_REAP_AT_SPAWN = FALSE
    BUGGY_CAP_COUNTS_EXITED = FALSE
SPECIFICATION Spec
INVARIANT NoOrphanedProc
