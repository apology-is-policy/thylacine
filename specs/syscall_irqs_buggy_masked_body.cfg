\* BUGGY: the AS-BUILT model -- the body never unmasks. Under noise the CPU
\* takes no interrupt for as long as the noise lasts, which is the defect
\* poll's preemption point was a stopgap for. Reproducing it HERE is the
\* evidence that deleting the point is safe rather than merely tidy.
CONSTANTS
    KTHREAD                    = FALSE
    BUGGY_MARKER_IGNORED       = FALSE
    BUGGY_UNMASK_BEFORE_MARK   = FALSE
    BUGGY_LATE_REMASK          = FALSE
    BUGGY_MARKER_NEVER_CLEARED = FALSE
    BUGGY_MASKED_BODY          = TRUE
SPECIFICATION SpecLive
INVARIANTS
    TypeOk
PROPERTIES
    CpuGetsItsInterrupts
