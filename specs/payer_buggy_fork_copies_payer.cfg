\* The child's mapping inherits the parent's payer flag. Its leaves are
\* then free, though the child is not the payer and nobody else pays
\* them: the child maps pages its page_count does not show.
\* Expected: ChargeExact VIOLATED at the child's first leaf.
CONSTANTS
    Spaces = {a, b, c}
    Creator = a
    Slots = {1, 2}
    BUGGY_HANDOVER_NO_OWED = FALSE
    BUGGY_NO_ADOPT = FALSE
    BUGGY_FORK_COPIES_PAYER = TRUE
    BUGGY_LOSER_KEEPS_CHARGE = FALSE
    BUGGY_UNMAP_RELEASES = FALSE
    BUGGY_NO_LAPSE = FALSE
    BUGGY_UNMAP_LAPSES = FALSE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT Shape
INVARIANT RecordIsResidency
INVARIANT ChargeExact
