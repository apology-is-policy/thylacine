\* BUG 7 -- the put before the replace (the round-3 audit's F12). The breaker
\* puts its share of the pristine page BEFORE its writable leaf replaces the
\* read-only one, so for one step its own leaf still translates to a page it
\* holds no share of; the other sharer's exit then frees it under that leaf.
\* Expected: NoReadableFreed VIOLATED.
CONSTANTS
    Sharers = {s1, s2}
    BUGGY_BREAK_UNLOCKED = FALSE
    BUGGY_TEARDOWN_NO_PIN = FALSE
    BUGGY_VFORK_OBSERVE_BEFORE_PARK = FALSE
    ALLOW_PROTECT = FALSE
    Pieces = 1
    BUGGY_PROTECT_KEEPS_PTE = FALSE
    BUGGY_FAULT_IGNORES_PROT = FALSE
    BUGGY_CLONE_PER_PIECE = FALSE
    MODEL_LEAF = TRUE
    BUGGY_PUT_BEFORE_REPLACE = TRUE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT NoReadableFreed
