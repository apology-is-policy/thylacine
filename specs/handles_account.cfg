SPECIFICATION Spec

\* MM-1c: the KObj_Account-focused clean cfg. AccountKObjs is non-empty and a
\* session can open, so AccountHandlesAtOrigin is proven with the only carrier
\* the spec has available to it. handles.cfg keeps AccountKObjs empty, leaving
\* its state space and runtime unchanged.

CONSTANTS
    Procs                       = {p1, p2}
    TxKObjs                     = {}
    HwKObjs                     = {}
    SrvKObjs                    = {}
    AccountKObjs                = {ka1, ka2}
    Rights                      = {R, T}
    RightTransfer               = T
    Caps                        = {C, HW}
    CapHwCreate                 = HW
    CapHostowner                = C
    BUGGY_RFORK_HOSTOWNER       = FALSE
    BUGGY_ELEVATE               = FALSE
    BUGGY_HW_TRANSFER           = FALSE
    BUGGY_DIRECT_TRANSFER       = FALSE
    BUGGY_CAPS_ELEVATE          = FALSE
    BUGGY_HW_DUP                = FALSE
    BUGGY_HW_OVERLAP            = FALSE
    BUGGY_HW_CREATE_NO_CAP      = FALSE
    BUGGY_RFORK_ELEVATE         = FALSE
    BUGGY_SPAWN_FDS_ELEVATE     = FALSE
    BUGGY_SRV_WALK_TX           = FALSE
    BUGGY_ACCOUNT_TRANSFER      = FALSE

CONSTRAINT
    StateConstraint

INVARIANTS
    Invariants
