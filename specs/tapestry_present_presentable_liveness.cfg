\* Warp WSI W-3b -- the PRESENTABLE liveness witness. The display-safe
\* teardown ORDERS the unbind and the compose drain before the unref, and an
\* ordered teardown can deadlock where an unordered one could not -- so the
\* load-bearing question is TERMINATION. Spec_Live adds weak fairness on the
\* presentable's drain actors (PUnbind, PComposeComplete, PClientRelease,
\* PServerRelease, PFree).
\*
\* PresentableEventuallyRetired: a retiring presentable always drains to the
\* unref. What makes it terminate: PPresentBind and PComposeIssue require
\* pstate = "registered", so a retiring presentable admits no NEW observers,
\* and no holder re-arms (PRegister requires "none"). EventuallyRetired: the
\* weave teardown still drains with the presentable machinery interleaved.
\* Expected: TLC-green.
SPECIFICATION Spec_Live

CONSTANTS
    ALLOW_DESTROY            = TRUE
    ALLOW_REWEAVE            = TRUE
    ALLOW_SERVER_DEATH       = TRUE
    ALLOW_COMPOSE            = TRUE
    BUGGY_EARLY_FREE         = FALSE
    BUGGY_RETIRE_NO_QUIESCE  = FALSE
    BUGGY_REWEAVE_NO_QUIESCE = FALSE
    BUGGY_STALE_MAP          = FALSE
    BUGGY_DRAIN_SKIPPED      = FALSE
    BUGGY_BLIT_DURING_FILL   = FALSE
    BUGGY_FILL_DURING_BLIT   = FALSE
    BUGGY_READBACK_FREE      = FALSE
    ALLOW_PRESENTABLE        = TRUE
    BUGGY_PUNBIND_SKIPPED    = FALSE
    BUGGY_PDRAIN_SKIPPED     = FALSE

INVARIANTS
    Invariants

PROPERTIES
    EventuallyRetired
    PresentableEventuallyRetired
