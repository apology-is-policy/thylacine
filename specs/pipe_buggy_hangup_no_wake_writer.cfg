\* BUGGY_HANGUP_NO_WAKE_WRITER: HangupWrite wakes readers only, as a close
\* does. Counterexample: two appends fill the ring, WriteSleep, then the
\* hangup -> the writer stays in WAITING_WRITE while writeEof makes
\* CanWrite hold. NoStuckWriter violated.

SPECIFICATION Spec

CONSTANTS
    Threads                              = {t1, t2}
    CAP                                  = 2
    BUGGY_WRITE_NO_WAKE_READER           = FALSE
    BUGGY_READ_NO_WAKE_WRITER            = FALSE
    BUGGY_CLOSE_WRITE_NO_WAKE_READER     = FALSE
    BUGGY_CLOSE_READ_NO_WAKE_WRITER      = FALSE
    BUGGY_WAKE_ONE_READER                = FALSE
    BUGGY_HANGUP_NO_WAKE_WRITER          = TRUE
    BUGGY_HANGUP_TAKES_BYTES             = FALSE

INVARIANTS
    Invariants

PROPERTIES
    NoByteAfterEof
