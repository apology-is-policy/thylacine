\* debug_stop_buggy_latch_ends_stop.cfg -- a park ends its Thread on a latched
\* interrupt, as the birth park did from DEBUG-FS-DESIGN 5f until 5g
\* (birth_park_terminate): a held child sent an interrupt dies at its birth park
\* with no group death published. Under 5g it stays held until it is released,
\* converted and resumed, or killed.
\* Expected: ParkEndsOnlyInDeath VIOLATED.
CONSTANTS
    Threads = {t1}
    BUGGY_STOP_BEFORE_DIE = FALSE
    BUGGY_OBSERVE_BEFORE_REGISTER = FALSE
    BUGGY_DOUBLE_WAKE = FALSE
    BUGGY_STRAND_ON_CLOSE = FALSE
    BUGGY_FAULT_STOP_UNGATED = FALSE
    BUGGY_STOP_SKIPS_SLEEPER = FALSE
    BUGGY_EXITKILL_IGNORED = FALSE
    HELD = TRUE
    BUGGY_HELD_RUNS_FREE = FALSE
    BUGGY_CONVERT_CLEARS_FIRST = FALSE
    BUGGY_ORPHAN_HOLD_STRANDS = FALSE
    BUGGY_BIRTH_WAIT_UNWOKEN = FALSE
    BUGGY_NO_DEATH_RECHECK = FALSE
    BUGGY_BIRTH_LATCH_ERETS = FALSE
    BUGGY_TAIL_LATCH_ERETS = FALSE
    BUGGY_LATCH_ENDS_STOP = TRUE
    BUGGY_SPAWNER_LATCH_RETURNS = FALSE
SPECIFICATION Spec
PROPERTY ParkEndsOnlyInDeath
