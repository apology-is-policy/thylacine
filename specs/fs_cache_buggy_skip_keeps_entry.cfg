\* BUGGY_SKIP_KEEPS_ENTRY counterexample (audit round 4 of M15, F4) -- an open
\* whose populate the gen guard discards keeps the entry from before it and
\* trusts it, as larder_attr_serve (which asks no version) then serves it. With
\* an external writer to make that entry stale, NoStalePastRevalidation fails.
\* Expected: TLC reports a NoStalePastRevalidation violation (open populate;
\* external write; a skipped open keeps the stale entry validated).
SPECIFICATION Spec

CONSTANTS
    Files                   = {f1, f2}
    Capacity                = 1
    MaxCvers                = 2
    EnableExternalWriter    = TRUE
    BUGGY_STALE_SERVE       = FALSE
    BUGGY_NO_OWN_INVALIDATE = FALSE
    EnableStaging           = FALSE
    BUGGY_READ_SKIPS_STAGED = FALSE
    BUGGY_LOST_STAGE        = FALSE
    EnableFlushPopulate     = FALSE
    BUGGY_POPULATE_UNFLUSHED = FALSE
    Opens                   = {o1}
    BUGGY_PEER_SKIPS_STAGED = FALSE
    BUGGY_PEER_WRITE_UNORDERED = FALSE
    BUGGY_SKIP_KEEPS_ENTRY  = TRUE
    BUGGY_NO_PIN = FALSE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    TypeOk
    CacheNeverAhead
    Bounded
    NoStalePastRevalidation
