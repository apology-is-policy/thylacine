\* BUGGY (the collector from #294 to NP-4c): safety holds, but Liveness FAILS.
\* The kthread unlinks a stranded arm under g_dev9p_poll_lock and flushes it
\* after the unlock; a close between the two finds no arm to cancel, its
\* Tclunk is refused (the arm's Tread still targets the fid), and the later
\* flush clunks nothing -- the slot leaks although the kthread flushes (WF on
\* KthreadGcFlush). Fixed by flushing under the lock, with the unlink.
SPECIFICATION Spec

CONSTANTS
    Fix = TRUE
    BUGGY_SPLIT_GC = TRUE
    NO_CLOSER = FALSE

INVARIANTS
    SafetyInvariants

PROPERTIES
    Liveness
