\* The payer's last unmap settles the record the way an eager region's
\* drop does when the region survives only in another Proc (#131):
\* refunded and lapsed while the payer lives. The books balance; the
\* vote does not -- the payer pays until its death (vote 119).
\* ChargeExact is listed AHEAD and must HOLD.
\* Expected: LapseOnlyAtDeath VIOLATED at the payer's last unmap.
CONSTANTS
    Spaces = {a, b, c}
    Creator = a
    Slots = {1, 2}
    BUGGY_HANDOVER_NO_OWED = FALSE
    BUGGY_NO_ADOPT = FALSE
    BUGGY_FORK_COPIES_PAYER = FALSE
    BUGGY_LOSER_KEEPS_CHARGE = FALSE
    BUGGY_UNMAP_RELEASES = FALSE
    BUGGY_NO_LAPSE = FALSE
    BUGGY_UNMAP_LAPSES = TRUE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT Shape
INVARIANT RecordIsResidency
INVARIANT ChargeExact
INVARIANT LapseOnlyAtDeath
