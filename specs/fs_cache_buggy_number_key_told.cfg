\* fs_cache_buggy_number_key.cfg with DeadStateSkipped left out. Expected:
\* NoMisdirectedLoss VIOLATED -- the dead holder's refused run is told to an
\* open of the new file at its fsync.
SPECIFICATION Spec

CONSTANTS
    Files                   = {f1, f2}
    Capacity                = 1
    MaxCvers                = 3
    EnableExternalWriter    = FALSE
    BUGGY_STALE_SERVE       = FALSE
    BUGGY_NO_OWN_INVALIDATE = FALSE
    EnableStaging           = TRUE
    BUGGY_READ_SKIPS_STAGED = FALSE
    BUGGY_LOST_STAGE        = FALSE
    EnableFlushPopulate     = TRUE
    BUGGY_POPULATE_UNFLUSHED = FALSE
    Opens                   = {o1, o2}
    BUGGY_PEER_SKIPS_STAGED = FALSE
    BUGGY_PEER_WRITE_UNORDERED = FALSE
    BUGGY_SKIP_KEEPS_ENTRY = FALSE
    BUGGY_NO_PIN = FALSE
    EnableReuse = TRUE
    MaxGen = 2
    BUGGY_NUMBER_KEY = TRUE
    BUGGY_UNNAMED_WALK = FALSE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    TypeOk
    CacheNeverAhead
    ServerNeverAhead
    Bounded
    NoStalePastRevalidation
    NoWrongRead
    NoLostStage
    OneHolder
    NamesTrue
    RecordsTrue
    NoMisdirectedLoss
