\* An unmap releases the slot the way a private lazy mapping's detach
\* does, and keeps every book exact while doing it: the record and its
\* payer are refunded. The page is freed while another sharer still has
\* a leaf for it -- and no counter can see that, which is why NoFreedLeaf
\* exists. RecordIsResidency and ChargeExact are listed AHEAD and must
\* HOLD.
\* Expected: NoFreedLeaf VIOLATED at the first unmap of a page a peer maps.
CONSTANTS
    Spaces = {a, b, c}
    Creator = a
    Slots = {1, 2}
    BUGGY_HANDOVER_NO_OWED = FALSE
    BUGGY_NO_ADOPT = FALSE
    BUGGY_FORK_COPIES_PAYER = FALSE
    BUGGY_LOSER_KEEPS_CHARGE = FALSE
    BUGGY_UNMAP_RELEASES = TRUE
    BUGGY_NO_LAPSE = FALSE
    BUGGY_UNMAP_LAPSES = FALSE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT Shape
INVARIANT RecordIsResidency
INVARIANT ChargeExact
INVARIANT NoFreedLeaf
