\* Warp-C C-1 -- the DRAIN counterexample. BUGGY_DRAIN_SKIPPED drops exactly
\* the DrainedOfBlits conjunct from ServerRelease and Free, modelling the
\* pre-Warp-C quiesce carried unchanged onto the composed path: the retire
\* still waits for the DIRECT-path in-flight class (intransfer = 0, and it is
\* genuinely satisfied along this trace) and is simply blind to the new one.
\*
\* This is the precise defect GPU-DESIGN section 4.5.6 pre-records against the
\* successor -- "a pipelined controlq, G-6+, must implement a real drain
\* before touching retire" -- and the reason it is worth a counterexample is
\* that the old quiesce LOOKS satisfied while the bug fires. Stage-0 synchrony
\* discharged I-40 by construction: there was never an outstanding composition
\* to wait for, so no drain code existed to be wrong. Removing the readback
\* removes that accident, and this cfg is what the omission costs.
\*
\* Expected: TLC reports NoTornCompose violated
\* (WeaveFirst -> Map -> Attach -> ComposeBlit -> Destroy -> ServerRelease
\* -> ClunkMap -> Free: the pages are freed with a host composition blit
\* still reading the resource -- the composed-path UAF).
SPECIFICATION Spec

CONSTANTS
    ALLOW_DESTROY            = TRUE
    ALLOW_REWEAVE            = FALSE
    ALLOW_SERVER_DEATH       = FALSE
    ALLOW_COMPOSE            = TRUE
    BUGGY_EARLY_FREE         = FALSE
    BUGGY_RETIRE_NO_QUIESCE  = FALSE
    BUGGY_REWEAVE_NO_QUIESCE = FALSE
    BUGGY_STALE_MAP          = FALSE
    BUGGY_DRAIN_SKIPPED      = TRUE
    BUGGY_BLIT_DURING_FILL   = FALSE
    BUGGY_FILL_DURING_BLIT   = FALSE
    BUGGY_READBACK_FREE      = FALSE

INVARIANTS
    NoTornCompose
