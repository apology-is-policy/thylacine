\* superseded rule under a server that always finishes the frame
\* (FairServerSpec). The 2026-07-19 model's claim, reproduced: block-through
\* was sound and live when the server could be trusted to send. So the
\* blockthrough counterexample comes from the server stopping, nothing else.
\* Expected: TLC-green.
