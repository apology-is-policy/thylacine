\* Thread-model C5 -- exec dooms its peers by a per-thread die flag, with the
\* "is mine set?" check in one threads_lock hold and the peers' flags set in
\* another (BUGGY_EXEC_PERTHREAD, LINEAGE L-2b's first sketch built naively).
\* Two threads exec at once: both pass the check, each dooms the other, both
\* abandon and die, and the last of them closes the Proc with no group death --
\* an exec that ended the process.
\* Expected: DoomedNeverLast VIOLATED.
CONSTANTS
    Threads = {t1, t2, t3}
    Main = t1
    Cap = 3
    NoThread = NoThread
    BUGGY_ADMIT_SPLIT = FALSE
    BUGGY_COUNT_SPLIT = FALSE
    BUGGY_SPAWNER_FREE = FALSE
    BUGGY_ZOMBIE_BEFORE_COMMIT = FALSE
    BUGGY_FREE_ON_CPU = FALSE
    BUGGY_TWO_REAPERS = FALSE
    BUGGY_EXEC_EARLY = FALSE
    BUGGY_WAITPID_UNLOCKED = FALSE
    BUGGY_REAP_AT_SPAWN = FALSE
    BUGGY_CAP_COUNTS_EXITED = FALSE
    BUGGY_EXEC_PERTHREAD = TRUE
    BUGGY_DOOM_MISSED = FALSE
SPECIFICATION Spec
INVARIANT DoomedNeverLast
