\* THE CONTROL. A kernel thread sets no marker, so the SAME machinery MUST
\* produce an involuntary switch in kernel mode -- kthreads stay preemptible
\* or #810 is lost. KthreadGetsPreempted is therefore expected to be
\* VIOLATED: the violation IS the pass, and check-syscall-irqs.sh asserts it.
\* EretWindowMasked must still hold here.
CONSTANTS
    KTHREAD                    = TRUE
    BUGGY_MARKER_IGNORED       = FALSE
    BUGGY_UNMASK_BEFORE_MARK   = FALSE
    BUGGY_LATE_REMASK          = FALSE
    BUGGY_MARKER_NEVER_CLEARED = FALSE
    BUGGY_MASKED_BODY          = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOk
    EretWindowMasked
    KthreadGetsPreempted
