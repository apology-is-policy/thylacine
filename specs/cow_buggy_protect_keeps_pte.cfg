\* BUG 4 -- protect keeps the PTE. A protect lowers the VMA's prot but leaves
\* the writable PTE a break installed, so the hardware keeps granting writes
\* the VMA no longer permits. The correct ProtectDown is the D-3b rule in one
\* locked step: uninstall the range, then change the prot.
\* Expected: NoWritablePteBeyondProt VIOLATED.
CONSTANTS
    Sharers = {s1, s2}
    BUGGY_BREAK_UNLOCKED = FALSE
    BUGGY_TEARDOWN_NO_PIN = FALSE
    BUGGY_VFORK_OBSERVE_BEFORE_PARK = FALSE
    ALLOW_PROTECT = TRUE
    Pieces = 1
    BUGGY_PROTECT_KEEPS_PTE = TRUE
    BUGGY_FAULT_IGNORES_PROT = FALSE
    BUGGY_CLONE_PER_PIECE = FALSE
SPECIFICATION SpecProtect
INVARIANT TypeOk
INVARIANT NoWritablePteBeyondProt
