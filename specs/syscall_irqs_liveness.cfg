\* LIVENESS. ONE property: the CPU is unmasked again and again, whatever the
\* producer does. Noise gets no fairness in either direction, so the property
\* may not lean on it.
\*
\* A second property was WITHDRAWN rather than weakened -- see the module's
\* closing comment. "A pending reschedule always eventually fires" is FALSE
\* for a non-preemptible kernel and TLC said so in five steps. The boundary
\* guarantee that IS true lives in syscall_irqs.cfg as TailTookItsPreempt.
CONSTANTS
    KTHREAD                    = FALSE
    BUGGY_MARKER_IGNORED       = FALSE
    BUGGY_UNMASK_BEFORE_MARK   = FALSE
    BUGGY_LATE_REMASK          = FALSE
    BUGGY_MARKER_NEVER_CLEARED = FALSE
    BUGGY_MASKED_BODY          = FALSE
SPECIFICATION SpecLive
INVARIANTS
    TypeOk
PROPERTIES
    CpuGetsItsInterrupts
