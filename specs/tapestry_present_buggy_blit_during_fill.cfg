\* Warp-C C-1 -- the P2 ORDERING counterexample, blit-during-fill direction.
\* The compositor issues its blit while a fill of the source host resource is
\* still in flight. The client renders on its context and the compositor blits
\* on its own; in-order controlq dequeue orders the COMMANDS but not GL
\* execution across two host contexts sharing an object, so nothing orders the
\* blit after the fill unless the compositor makes it so.
\*
\* Today the hazard is MASKED: transfer_from_3d_sync must produce bytes and
\* therefore forces the sync as a side effect. A blit has no such side effect,
\* so this bug cannot be hit today and becomes reachable at exactly the
\* sub-chunk that deletes the readback (C-4).
\*
\* P2 measured 0 reorderings in 500 unsynced trials on thyla-pi (real V3D)
\* with an INVERTED arm proving the probe could see one (40/40). That bounds
\* the per-trial rate at ~0.6% (95%, rule of three) on THAT stack for THAT
\* access pattern -- and V3D is a single-queue tiled renderer, so in-order
\* execution there may be a property of the hardware rather than of
\* virglrenderer, which would say nothing about a multi-queue desktop GPU.
\* A negative is not a proof, so the model carries the hazard the measurement
\* could not reproduce.
\*
\* Expected: TLC reports NoStaleCompose violated
\* (... -> Draw -> Submit -> ComposeBlit with intransfer > 0: the blit reads
\* the resource while the fill is still landing -- the torn/stale frame, an
\* I-40 tearing-freedom violation).
