\* debug_stop_buggy_birth_latch_rerun.cfg -- the birth park's latch leg re-runs
\* the checkpoint in place, as the first draft of the design did. Note
\* delivery consumes the latch only on a stack pointer it trusts. Once a
\* debugger has written a bad one during a stop, delivery declines, the park
\* leaves on the latch again, and the re-run never ends: in the impl, a CPU
\* spinning with interrupts masked (audit round 1, F1).
\* Expected: LatchedHeldChildEnds VIOLATED.
CONSTANTS
    Threads = {t1}
    BUGGY_STOP_BEFORE_DIE = FALSE
    BUGGY_OBSERVE_BEFORE_REGISTER = FALSE
    BUGGY_DOUBLE_WAKE = FALSE
    BUGGY_STRAND_ON_CLOSE = FALSE
    BUGGY_FAULT_STOP_UNGATED = FALSE
    BUGGY_STOP_SKIPS_SLEEPER = FALSE
    BUGGY_EXITKILL_IGNORED = FALSE
    HELD = TRUE
    BUGGY_HELD_RUNS_FREE = FALSE
    BUGGY_CONVERT_CLEARS_FIRST = FALSE
    BUGGY_ORPHAN_HOLD_STRANDS = FALSE
    BUGGY_BIRTH_WAIT_UNWOKEN = FALSE
    BUGGY_NO_DEATH_RECHECK = FALSE
    BUGGY_BIRTH_LATCH_ERETS = FALSE
    BUGGY_BIRTH_LATCH_RERUN = TRUE
SPECIFICATION Spec
PROPERTY LatchedHeldChildEnds
