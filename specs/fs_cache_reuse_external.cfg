\* From fs_cache_reuse.cfg: Files {f1} and EnableExternalReuse TRUE (two constants),
\* CacheOfLiveFile left out (audit round 10 of M15, F5): another client's or
\* session's create reuses the number, and the Larder keeps the deleted file's
\* entry, so the serve's name check alone keeps the new file's opens off it.
\* Expected: GREEN -- every invariant listed.
SPECIFICATION Spec

CONSTANTS
    Files                   = {f1}
    Capacity                = 1
    MaxCvers                = 3
    EnableExternalWriter    = FALSE
    BUGGY_STALE_SERVE       = FALSE
    BUGGY_NO_OWN_INVALIDATE = FALSE
    EnableStaging           = TRUE
    BUGGY_READ_SKIPS_STAGED = FALSE
    BUGGY_LOST_STAGE        = FALSE
    EnableFlushPopulate     = TRUE
    BUGGY_POPULATE_UNFLUSHED = FALSE
    Opens                   = {o1, o2}
    BUGGY_PEER_SKIPS_STAGED = FALSE
    BUGGY_PEER_WRITE_UNORDERED = FALSE
    BUGGY_SKIP_KEEPS_ENTRY = FALSE
    BUGGY_NO_PIN = FALSE
    EnableReuse = TRUE
    MaxGen = 2
    BUGGY_NUMBER_KEY = FALSE
    BUGGY_UNNAMED_WALK = FALSE
    BUGGY_NUMBER_SERVE = FALSE
    EnableUnnamed = FALSE
    BUGGY_UNNAMED_SERVE = FALSE
    BUGGY_UNNAMED_LEG_TOLD = FALSE
    BUGGY_UNNAMED_MARKS_SEEN = FALSE
    EnableExternalReuse = TRUE
    BUGGY_SERVE_OLDER = FALSE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    TypeOk
    CacheNeverAhead
    ServerNeverAhead
    Bounded
    NoStalePastRevalidation
    NoWrongRead
    NoLostStage
    OneHolder
    NamesTrue
    RecordsTrue
    DeadStateSkipped
    NoMisdirectedLoss
    NoMisdirectedSeen
