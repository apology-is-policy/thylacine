\* CLEAN, a user thread. Both safety properties must hold.
\* Read this cfg WITH syscall_irqs_kthread.cfg: a "no involuntary switch"
\* green is worthless on its own, because a model that cannot switch at all
\* satisfies it. That cfg is the control one variable away.
CONSTANTS
    KTHREAD                    = FALSE
    BUGGY_MARKER_IGNORED       = FALSE
    BUGGY_UNMASK_BEFORE_MARK   = FALSE
    BUGGY_LATE_REMASK          = FALSE
    BUGGY_MARKER_NEVER_CLEARED = FALSE
    BUGGY_MASKED_BODY          = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOk
    NoInvoluntarySwitchInBody
    EretWindowMasked
    TailTookItsPreempt
