\* B-3e -- the anonymous-mapping merge without the one-bias rule. The
\* extension maps whatever offset it is handed instead of the one the
\* Burrow's bias names for the free address -- what a second bias (an
\* mremap, or a map of the same Burrow at another address) would make it
\* do. An offset still mapped elsewhere is then mapped twice: one page in
\* two places, and the detach of either releases it under the other.
\* The accounting is blind to it -- page_count still equals RSS, no page
\* is unreachable, and every free address still names an empty offset --
\* which is why NoAlias exists. ChargeConserved, NoOrphan and ZeroRead
\* are listed AHEAD of it and must HOLD.
\* Expected: NoAlias VIOLATED at the first Extend onto a mapped offset.
CONSTANTS
    Slots = {s1, s2, s3, s4}
    BUGGY_REPLACE_KEEPS_ORPHANS = FALSE
    BUGGY_DETACH_NO_REFUND = FALSE
    BUGGY_EXTEND_ALIAS = TRUE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT ChargeConserved
INVARIANT NoOrphan
INVARIANT ZeroRead
INVARIANT NoAlias
