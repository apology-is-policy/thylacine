\* The nested-redeem RE-TAG (G6; the A-4a F2 shape): a further redeem on a
\* scoped Proc allocates a FRESH scope + root, so a member of a propagating
\* scope that redeems (say) CAP_JIT walks its flowed caps OUT of the imperium
\* teardown: the original root dies, the sweep no longer matches the member,
\* and the caps that flowed from that root outlive it.
\* OneScopePerProc (depth 2) and MembersNeverRoot (depth 3) catch the re-tag
\* earlier; this cfg checks the PRIVILEGE leg alone so the counterexample TLC
\* prints is the escape itself.
\* Expected: TLC reports NoElevatedOutlivesScope violated
\* (RedeemFresh -> Fork -> BuggyRedeemRetag(member) -> Exit(root): the member
\* is alive and elevated, and the root whose scope it joined is dead).
CONSTANTS
    Procs     = {p1, p2, p3}
    Caps      = {c1, c2}
    MaxScopes = 3
    BUGGY_STRAGGLER         = FALSE
    BUGGY_RETAG             = TRUE
    BUGGY_FLOW_WITHOUT_FLAG = FALSE
    BUGGY_NEST_ADMITTED     = FALSE
SPECIFICATION Spec
INVARIANT TypeOk
INVARIANT NoElevatedOutlivesScope
