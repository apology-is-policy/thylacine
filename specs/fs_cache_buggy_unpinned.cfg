\* Votes M24/M24a counterexample (audit round 5 of M15, F1): open o1's
\* write-through passes its leg (nothing staged), then open o2 starts staging
\* while the write is in flight, and the write lands over o2's newer stage.
\* Expected: InvariantsWb VIOLATED (NoWrongRead: o2's own read serves its stage
\* while the server and the client's content have moved past it). One variable
\* (BUGGY_NO_PIN) from fs_cache_wb.cfg. Pins LARDER-DESIGN 12.6's pin: every
\* changing operation through an open that is not the holder pins the file
\* until its wire op and its invalidate are done.
SPECIFICATION Spec

CONSTANTS
    Files                   = {f1, f2}
    Capacity                = 1
    MaxCvers                = 3
    EnableExternalWriter    = FALSE
    BUGGY_STALE_SERVE       = FALSE
    BUGGY_NO_OWN_INVALIDATE = FALSE
    EnableStaging           = TRUE
    BUGGY_READ_SKIPS_STAGED = FALSE
    BUGGY_LOST_STAGE        = FALSE
    EnableFlushPopulate     = TRUE
    BUGGY_POPULATE_UNFLUSHED = FALSE
    Opens                   = {o1, o2}
    BUGGY_PEER_SKIPS_STAGED = FALSE
    BUGGY_PEER_WRITE_UNORDERED = FALSE
    BUGGY_SKIP_KEEPS_ENTRY = FALSE
    BUGGY_NO_PIN = TRUE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    InvariantsWb
