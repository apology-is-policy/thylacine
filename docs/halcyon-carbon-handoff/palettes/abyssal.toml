# Stock Halcyon schema: complete 57-key compatibility projection.
# Not pixel-exact alone: pair with ui-palettes/abyssal.toml AFTER implementing Instrument v1.
# Ember changes are an explicit new-profile policy amendment. No base inheritance.
# ANSI and bevel faces are DERIVED, not sampled from the mockup.
[meta]
name = "Abyssal Sonar"

[palette]
floor = "#060D0F"
surface = "#102024"
header = "#081215"
raised = "#15262A"
border = "#294147"
blank = "#0B1518"
selection = "#203537"
island_rule = "#507B73"
fg = "#DCE8E5"
fg_dim = "#C2D4D0"
fg_muted = "#92A5A1"
fg_subtle = "#5C706C"
bevel_top = "#2E3435"
bevel_left = "#1C2325"
bevel_right = "#050A0C"
bevel_bottom = "#030708"
ember = "#78AFA4"
ember_dim = "#507B73"
ember_deep = "#507B73"
status_bg = "#071113"
status_fg = "#DCE8E5"
status_muted = "#92A5A1"
status_idle = "#5C706C"

[palette.sage]
key = "#7A9D80"
tint = "#081215"
raised = "#15262A"
border = "#192D31"
fg = "#DCE8E5"
fg_dim = "#92A5A1"
fg_muted = "#5C706C"

[palette.cinnabar]
key = "#BB726E"
tint = "#081215"
raised = "#15262A"
border = "#192D31"
fg = "#DCE8E5"
fg_dim = "#92A5A1"
fg_muted = "#5C706C"

[palette.syntax]
slate = "#78AFA4"
sage = "#7E9DB0"
sand = "#BB726E"
moss = "#507B73"
ash = "#7A9D80"
dusk = "#91BBB3"
smoke = "#5C706C"
fen = "#7A9D80"
cinnabar = "#BB726E"

[terminal]
bg = "#081416"
fg = "#B5C9C5"
ansi = ["#0B1518", "#BB726E", "#7A9D80", "#78AFA4", "#7E9DB0", "#507B73", "#7C9D98", "#92A5A1", "#5C706C", "#C4938F", "#95B29C", "#94BFB6", "#98B2BF", "#779A93", "#97B2AE", "#B5C9C5"]

[type]
smooth = 0

[geometry]
bevel = 2
gap = 3
hairline = 1
header_h = 32
status_h = 25
tag_pad_x = 0
tab_strip_h = 0
