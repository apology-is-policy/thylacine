bevel_right = "#A6A29B"
bevel_bottom = "#73706B"
ember = "#624C65"
ember_dim = "#826F84"
ember_deep = "#826F84"
status_bg = "#E0DCD3"
status_fg = "#211E1C"
status_muted = "#5A524C"
