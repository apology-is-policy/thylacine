bevel_bottom = "#060504"
ember = "#79A097"
ember_dim = "#526F69"
ember_deep = "#526F69"
status_bg = "#100C0A"
status_fg = "#E8DED2"
status_muted = "#AA9C8E"
status_idle = "#70645A"

[palette.sage]
