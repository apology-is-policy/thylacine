# Stock Halcyon schema: complete 57-key compatibility projection.
# Not pixel-exact alone: pair with ui-palettes/shock.toml AFTER implementing Instrument v1.
# Ember changes are an explicit new-profile policy amendment. No base inheritance.
# ANSI and bevel faces are DERIVED, not sampled from the mockup.
[meta]
name = "System Shock Node"

[palette]
floor = "#070609"
surface = "#17131C"
header = "#0C0A0F"
raised = "#211A28"
border = "#493B50"
blank = "#100D13"
selection = "#2B2231"
island_rule = "#705A78"
fg = "#E0DBE3"
fg_dim = "#CEC5D0"
fg_muted = "#9A8E9F"
fg_subtle = "#685B6E"
bevel_top = "#2F2E30"
bevel_left = "#1D1C1F"
bevel_right = "#050507"
bevel_bottom = "#040305"
ember = "#9978A5"
ember_dim = "#705A78"
ember_deep = "#705A78"
status_bg = "#0B080D"
status_fg = "#E0DBE3"
status_muted = "#9A8E9F"
status_idle = "#685B6E"

[palette.sage]
key = "#668D7B"
tint = "#0C0A0F"
raised = "#211A28"
border = "#2D2533"
fg = "#E0DBE3"
fg_dim = "#9A8E9F"
fg_muted = "#685B6E"

[palette.cinnabar]
