tint = "#0C0A0F"
raised = "#211A28"
border = "#2D2533"
fg = "#E0DBE3"
fg_dim = "#9A8E9F"
fg_muted = "#685B6E"

[palette.syntax]
slate = "#9978A5"
sage = "#699996"
sand = "#B45E63"
moss = "#705A78"
ash = "#668D7B"
dusk = "#A98BB2"
smoke = "#685B6E"
fen = "#668D7B"
cinnabar = "#B45E63"

[terminal]
bg = "#0D0B11"
fg = "#C4BBC7"
ansi = ["#100D13", "#B45E63", "#668D7B", "#9978A5", "#699996", "#705A78", "#689389", "#9A8E9F", "#685B6E", "#C08187", "#88A398", "#AD94B6", "#8AABAC", "#8F7E96", "#8AA7A2", "#C4BBC7"]

[type]
