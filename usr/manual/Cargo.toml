# `manual` -- the Operator's Manual reader (docs/MANUAL-DESIGN.md). Reads a
# section of the manual (Markdown, installed at /manual) and writes it as
# Beacon: headings, tables, preformatted blocks and emphasis as frames at the
# rich tier, the same payload without frames elsewhere. `manual --check`
# validates a section against the format.
#
# lib + bin (the `view` pattern): the LIB is the pure half -- the format checker
# and parser, the renderer, word wrapping, section lookup -- host-tested via
#   cargo test -p manual --lib --no-default-features --target aarch64-apple-darwin
# The BIN is the thin syscall body (the `backend` feature -> libthyla-rs).
[package]
name = "manual"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["backend"]
backend = ["dep:libthyla-rs"]

[lib]
name = "manual"
path = "src/lib.rs"

[[bin]]
name = "manual"
path = "src/main.rs"
required-features = ["backend"]

[dependencies]
libthyla-rs = { path = "../lib/libthyla-rs", optional = true }
beacon = { path = "../lib/beacon" }

# The bounds test runs the reader under the guest heap's allocator.
[dev-dependencies]
linked_list_allocator = { version = "0.10", default-features = false }
