[package]
name = "libutopia"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "libutopia"
path = "src/lib.rs"

# `backend` is libthyla-rs, and therefore the syscall half. It is ON by default,
# so every consumer builds exactly what it built before; turning it OFF drops
# the modules that reach for a syscall and leaves the pure ones -- which is what
# makes `cargo test --no-default-features --target <host>` possible at all.
#
# Before this, libthyla-rs was an unconditional dependency and its ELF-only
# `_start` asm could not link for a host target, so the crate could not be
# compiled off the device and NOT ONE of its unit tests had ever executed
# anywhere. The measured cost was 399 stranded tests -- the largest such block
# in the tree by a wide margin (`tools/test-rust.sh` reports it per crate).
[features]
default = ["backend"]
backend = ["dep:libthyla-rs"]

[dependencies]
# libutopia is the application-helpers layer for the Utopia surface
# (palette + ANSI emission + path display). It depends on libthyla-rs
# for the alloc plumbing (the consumer binary declares ThylaAlloc as
# its #[global_allocator]).
#
# It DOES call kernel surfaces, and the line above used to claim otherwise --
# false since job control landed (`t_tty_cont` in eval/builtin.rs) and more so
# since the namespace built-ins. Both are syscall-bearing for the same
# structural reason: a built-in exists precisely when the effect must land on
# the SHELL'S OWN Proc -- its terminal foreground group, its Territory -- which
# a spawned command cannot do. The layering rule that survives is narrower:
# PARSING and formatting stay pure (and testable); only the built-ins whose
# whole purpose is to mutate this Proc reach for a syscall.
libthyla-rs = { path = "../../lib/libthyla-rs", optional = true }
# IM-4: the shared, host-tested imperium /proc-line parser + fasces renderer
# (one parser for the kernel ABI line, also used by the `imperium` tool).
fasces = { path = "../../lib/fasces" }
# H-1c: the Beacon zone frames (wire emission only -- pure bytes, no
# syscalls; the ut binary resolves the tier and hands Repl the flag, so
# the no-kernel-surfaces layering above holds).
beacon = { path = "../../lib/beacon" }

[dev-dependencies]
# The terminal model Halcyon renders with (pure, zero dependencies), so the
# line editor's tests can assert on the SCREEN a byte stream leaves rather than
# on the bytes: the completion strip once came back to the wrong row after a
# bottom-row scroll while every assertion on emitted bytes passed.
vt = { path = "../../lib/vt" }
