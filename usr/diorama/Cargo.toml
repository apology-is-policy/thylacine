[package]
name = "diorama"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "diorama"
path = "src/main.rs"

[dependencies]
# libthyla-rs provides _start + #[panic_handler] + the SVC wrappers + ThylaAlloc.
# The diorama is a device-less native /srv server (the ptyfs / corvus precedent)
# -- no libdriver, no hardware, no netdev.
libthyla-rs = { path = "../lib/libthyla-rs" }
