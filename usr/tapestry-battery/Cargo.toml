[package]
name = "tapestry-battery"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "tapestry-battery"
path = "src/main.rs"

[dependencies]
libtapestry = { path = "../lib/libtapestry" }
# The compositor's placement math (letterbox), so the single-slot leg's sample
# points derive from the SAME function tapestryd composes by.
libhalcyon = { path = "../lib/libhalcyon" }
libthyla-rs = { path = "../lib/libthyla-rs" }
