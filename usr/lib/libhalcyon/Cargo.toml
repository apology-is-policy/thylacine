# libhalcyon -- the Halcyon environment library (HALCYON.md section 13).
#
# H-3a lands the `theme` module: the Daylight visual-scripture token source
# (docs/HALCYON-VISUAL.md), shared by BOTH consumers of the ratified split --
# halcyond's transcript Sheet + chrome painter, and tapestryd's pane
# bevel/hairline/cast-shadow constants. no_std + no deps: pure colour + metric
# constants (the vt/cartoon crate pattern), host-testable.
[package]
name = "libhalcyon"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
# HALCYON-THEME 3.2: `theme::DAYLIGHT` is public ONLY under this feature.
# Production code must reach every token through a threaded `&Theme`, so a
# consumer enables this as a DEV-dependency -- its scripture-pinning tests can
# name the const, its shipped binary cannot (resolver 2 keeps a dev-only
# feature out of `cargo build`). The loader's floor is `theme::builtin()`,
# which is public unconditionally.
theme-fixture = []

[dependencies]
vt = { path = "../vt" }
