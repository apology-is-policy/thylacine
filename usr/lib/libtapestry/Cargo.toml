[package]
name = "libtapestry"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "tapestry"
path = "src/lib.rs"

[features]
default = ["guest"]
# The syscall-bound half (every Surface + the ring's Loom + session). Off,
# the crate is the wire types + the ring's slot bookkeeping, host-testable:
#   cargo test -p libtapestry --no-default-features --target aarch64-apple-darwin
guest = ["dep:libthyla-rs"]

[dependencies]
libthyla-rs = { path = "../libthyla-rs", optional = true }
