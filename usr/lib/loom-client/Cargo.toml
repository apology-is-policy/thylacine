[package]
name = "loom-client"
version = "0.1.0"
# The cores were written and tested as 2024; keeping it installs exactly what
# was tested (docs/ASYNC-SERVICE-ABI.md, "Native Rust client cores").
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
name = "loom_client"
path = "src/lib.rs"

# The native Loom client cores. They make no syscall, so the host tests them
# (make test-rust) and libthyla-rs supplies the kernel calls, as with thyla-heap.

[features]
# The simulated kernel, for a crate that drives this adapter in its own host
# tests. A dev-dependency only: resolver 2 keeps it out of `cargo build`, and it
# needs std.
sim = []
