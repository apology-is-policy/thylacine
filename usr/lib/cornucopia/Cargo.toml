[package]
name = "cornucopia"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "cornucopia"
path = "src/lib.rs"

[features]
# The display-scale bakes (HALCYON-SCALE 6: advances 11/12/13/15/18/20 for
