# Duke Nukem 3D shareware -- the per-game DOSBox-X config (Thylacine DX-8).
#
# Run it:   cp -r /duke3d ~/duke3d ; cd ~/duke3d ; dosbox-x
# DOSBox-X finds this file in the current directory, applies the settings and
# runs the [autoexec] section. Everything here can still be overridden per
# launch with -set "SECTION KEY=VALUE" (see docs/manual/40-dosbox.md).
#
# The system defaults (/lib/dosbox-x/dosbox-x.conf) already carry these values;
# they are repeated so the copied game directory is self-contained.

[sdl]
# Click in the window to capture the mouse: motion then turns/aims. Ctrl+F10
# releases it. The game's fire button works with or without capture.
autolock=true

[cpu]
# The CAP_JIT dynarec (I-42); Pentium-class fixed speed (cycles=auto hunts).
core=dynamic_rec
cycles=fixed 60000

[autoexec]
@echo off
mount c .
c:
DUKE3D.EXE
