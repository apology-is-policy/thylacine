# Tomb Raider (1996) 3dfx demo -- the per-game DOSBox-X config (Thylacine DX-8).
#
# Run it:   cp -r /tombraider ~/tombraider ; cd ~/tombraider ; dosbox-x
# DOSBox-X finds this file in the current directory, applies the settings and
# runs the [autoexec] section. Everything here can still be overridden per
# launch with -set "SECTION KEY=VALUE" (see docs/manual/40-dosbox.md).

[sdl]
autolock=true

[cpu]
# The CAP_JIT dynarec (I-42); Pentium-class fixed speed (cycles=auto hunts).
core=dynamic_rec
cycles=fixed 60000

[voodoo]
# TOMB.EXE is the 3dfx build: it talks Glide to an emulated Voodoo card. The
# CPU rasteriser (software) needs no host GPU; the game fails to start without
# a Voodoo ("Failed to download texture to 3Dfx board").
voodoo_card=software

[autoexec]
@echo off
mount c .
c:
TOMB.EXE
