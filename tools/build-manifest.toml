# tools/build-manifest.toml -- the Thylacine build input manifest.
#
# The single pinned record of every input the build needs that does NOT already
# travel in this repo: the sibling forks (by commit), the manual-drop cache
# inputs (by URL + sha256), the network input, and the remotely-built Clade
# artifacts. Design: docs/BUILD-CONFIG-DESIGN.md section 5.
#
# Consumed by tools/forage.sh (gathers what it can, instructs on the rest) and by
# build.sh's detect-and-instruct (an absent chunk input prints the remedy here
# instead of skipping silently). This is ALSO the payload definition the install
# disc (docs/INSTALLER.md) will consume -- the shared foundation, not a side quest.
#
# TOML because the entries are structured (repo + commit + patch-series + hash);
# the build CONFIG artifact (configs/*.config, section 4) stays flat KEY=value.
# tools/forage.sh reads a controlled TOML SUBSET (this file): [section.name]
# tables + `key = "value"` / `key = bareword` + `#` comments. Do not add arrays,
# inline tables, or multi-line strings without extending the reader (manifest_get).
#
# The `forageable` field tells forage.sh what it can DO with each input:
#   clone         git clone/fetch the repo + checkout `commit` into `path`
#   clone-sparse  a PARTIAL (blob:none) clone of a huge upstream at the pinned
#                 `commit` (fetched via `tag`), a sparse cone (`sparse`, space-
#                 separated dirs), a local `branch`, then `git am` of every
#                 patch under the in-repo `patches` dir. Upstream + our series;
#                 no fork of our own to host.
#   download      curl `url` into `dir`/`file`, then verify `sha256`
#   remote-pull   run `pull` (delegates to the Clade builder; needs it reachable)
#   remote-source a source pin for a remotely-built artifact; not fetched locally
#   manual        no public source; the operator must supply it at `path`
#   auto-at-build build.sh fetches it itself at build time; no manual action

[meta]
schema  = "1"
updated = "2026-09-21"

# --- forks: sibling git trees, pinned by commit ------------------------------
# `path` is where the build expects the tree (the `env` override points here too);
# `clone_dest` (where given) is where `git clone` lands it when it differs.

[fork.go]
path       = "~/projects/go-thylacine"
env        = "GOFORK"
probe      = "bin/go"
repo       = "https://github.com/apology-is-policy/go-thylacine.git"
commit     = "4bb69d2"
branch     = "master"
feeds      = "the Go toolchain (/goroot), the go driver, gopls, the Go boot probes"
forageable = "clone"

[fork.ambush]
path       = "~/projects/ambush"
env        = "AMBUSHFORK"
probe      = ".git"
repo       = "https://github.com/apology-is-policy/ambush.git"
commit     = "563bae9"
branch     = "master"
feeds      = "the ambush debugger (staged into the /goroot bake)"
forageable = "clone"

[fork.stratum]
path       = "~/projects/stratum/v2"
clone_dest = "~/projects/stratum"
env        = "STRATUM_SRC"
probe      = "CMakeLists.txt"
repo       = "https://github.com/apology-is-policy/stratum.git"
branch     = "main"
feeds      = "stratumd (the Stratum FS daemon; every image needs it)"
forageable = "clone"

[fork.gopls]
path       = "~/projects/gopls"
env        = "GOPLSFORK"
probe      = ".git"
commit     = "f65d347"
branch     = "master"
feeds      = "gopls (the Go IDE server; staged into the /goroot bake)"
forageable = "manual"

[fork.llvm]
path       = "~/projects/llvm-thylacine"
repo       = "https://github.com/llvm/llvm-project.git"
commit     = "251b5b5"
branch     = "thylacine"
base       = "llvmorg-22.1.8"
patches    = "a 6-patch series over llvmorg-22.1.8"
feeds      = "the Clade device toolchain (built on thyla-keep; source pin only)"
forageable = "remote-source"

[fork.mesa]
path       = "~/projects/mesa-thylacine"
repo       = "https://gitlab.freedesktop.org/mesa/mesa.git"
commit     = "b7f9ed2"
feeds      = "the Clade GL stack (virgl/V3D; built remotely; source pin only)"
forageable = "remote-source"

# --- source: a pinned UPSTREAM tree + an in-repo patch series -----------------
# Not a fork: nothing of ours is hosted. WebKit is ~13 GB whole; the partial
# sparse clone JavaScriptCore needs is ~230 MB. build.sh refuses a checkout that
# is not exactly pin + series (webkit_checkout_ok), so this section and the
# WEBKIT_PIN constant in tools/build.sh must move together.

[source.webkit]
path       = "~/projects/webkit-thylacine"
env        = "WEBKITFORK"
probe      = "Source/JavaScriptCore/CMakeLists.txt"
repo       = "https://github.com/WebKit/WebKit.git"
tag        = "webkitgtk-2.54.0"
commit     = "5220e80b97a253c60ed899361654142ab5021998"
branch     = "thylacine"
sparse     = "Source/JavaScriptCore Source/WTF Source/bmalloc Source/cmake Tools/Scripts PerformanceTests/SunSpider/tests/sunspider-1.0.2"
patches    = "usr/ports/webkit/patches"
feeds      = "CHUNK_WEBKIT (Boosty B-0: JavaScriptCore, /webkit/jsc)"
forageable = "clone-sparse"

# --- cache: manual-drop inputs, sha256-pinned --------------------------------
# The sha256 is the source of truth; the URL is the canonical Alpine mirror. If a
# URL 404s (Alpine archives an old -rN when a newer one lands), the sha still
# identifies the exact file -- fetch it from the Alpine archive and drop it in.

