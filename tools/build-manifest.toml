file       = "alpine-minirootfs-3.21.0-aarch64.tar.gz"
dir        = "build/cache"
url        = "https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/aarch64/alpine-minirootfs-3.21.0-aarch64.tar.gz"
sha256     = "f31202c4070c4ef7de9e157e1bd01cb4da3a2150035d74ea5372c5e86f1efac1"
feeds      = "CHUNK_ALPINE (the VIVARIUM Alpine minirootfs bundle)"
forageable = "download"

[cache.busybox]
file       = "busybox-static-1.37.0-r14.apk"
dir        = "build/cache"
url        = "https://dl-cdn.alpinelinux.org/alpine/v3.21/main/aarch64/busybox-static-1.37.0-r14.apk"
sha256     = "6fd7ea97062beb51fa785ba858f823e1dfe4daf6bfa91ff4d5359b1061988c69"
feeds      = "CHUNK_ALPINE (the static busybox shell -- stock Alpine ELFs are dynamic-PIE)"
